<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandi POS - Command Center</title>
  <style>
    :root { --admin: #e74c3c; --waiter: #3498db; --bg: #1e272e; --card: #2f3640; --text: #f5f6fa; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--text); }
    
    /* Top Bar */
    .top-bar { background: #111; padding: 6px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; font-size: 0.8rem; }
    .dev-info { color: #00e5ff; text-decoration: none; font-weight: bold; }
    .lang-selector { background: #333; color: white; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; outline: none; }
    
    /* Login */
    #login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .login-box { background: var(--card); padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 5px solid var(--admin); width: 300px; }
    .login-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: none; font-size: 1.1rem; text-align: center; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #2ecc71; color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    
    /* Header */
    header { background: #1a2228; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #444; }
    .role-badge { background: var(--admin); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    .btn-logout { background: transparent; border: 1px solid #ccc; color: #ccc; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-weight:bold; }
    
    /* Dashboard */
    .financials { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; background: #151b20; }
    .fin-card { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid #2ecc71; }
    .fin-card h3 { margin: 0; font-size: 0.9rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .fin-card .amount { font-size: 2rem; font-weight: 900; color: #2ecc71; margin-top: 5px; }

    .section-title { padding: 20px 20px 0; margin: 0; font-size: 1.2rem; color: #aaa; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 20px; }
    .table-card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-top: 5px solid #7f8fa6; position: relative; }
    .table-card.alert { border-top-color: #e74c3c; animation: flash 1s infinite alternate; }
    .table-card.upi-pending { border-top-color: #9b59b6; }
    .table-card.cash-pending { border-top-color: #f1c40f; }
    
    .table-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; }
    .table-header h2 { margin: 0; font-size: 1.5rem; }
    .status-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #555; font-weight:bold; }
    
    .items-list { margin: 0; padding: 0; list-style: none; max-height: 220px; overflow-y: auto; }
    .items-list li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #3d464d; font-size: 0.95rem; }
    .pending-kot { color: #f39c12; font-weight: bold; }
    .printed-kot { color: #95a5a6; }
    
    .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: bold; color: #2ecc71; margin: 15px 0; border-top: 1px solid #444; padding-top: 10px; }
    
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .actions button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; font-size: 0.95rem; }
    .btn-kot { background: #e67e22; }
    .btn-clear { background: #2ecc71; display: none; }
    .btn-waiter-cash { background: #3498db; display: none; }
    .btn-resolve { background: #e74c3c; }

    @keyframes flash { from { box-shadow: 0 0 10px #e74c3c; } to { box-shadow: 0 0 25px #e74c3c; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="https://catb12345612-ai.github.io/Syed-Zeeshaan-Ali-High-Fledged-Engineering-And-Digital-Tech-Solutions-Site/" target="_blank" class="dev-info">
      Dev: Syed Zeeshaan Ali | High-Fledged Solutions
    </a>
    <select class="lang-selector" onchange="changeLang(this.value)">
      <option value="en">English</option>
      <option value="hi">हिंदी (Hindi)</option>
      <option value="te">తెలుగు (Telugu)</option>
    </select>
  </div>

  <div id="login-screen">
    <div class="login-box">
      <h2 style="margin-top:0;" data-i18n="pos_access">POS Access</h2>
      <input type="password" id="pin-input" data-i18n-placeholder="pin_placeholder" placeholder="Enter PIN / Password" autofocus>
      <button onclick="attemptLogin()" data-i18n="login_btn">Login</button>
      <p style="color:#aaa; font-size:0.85rem; margin-top:15px;" data-i18n="login_hint">Admin (admin123) or Waiter (waiter123)</p>
    </div>
  </div>

  <div id="main-dashboard" style="display: none;">
    <header>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="role-badge" id="ui-role-badge">WAITING</span>
        <strong style="font-size: 1.2rem; letter-spacing:1px;" data-i18n="command_center">Command Center</strong>
      </div>
      <button class="btn-logout" onclick="location.reload()" data-i18n="lock_screen">Lock Screen</button>
    </header>

    <div class="financials" id="admin-financials">
      <div class="fin-card"><h3 data-i18n="cash_earned">Cash Earned</h3><div class="amount">₹<span id="stat-cash">0</span></div></div>
      <div class="fin-card"><h3 data-i18n="online_earned">Online Earned</h3><div class="amount">₹<span id="stat-online">0</span></div></div>
      <div class="fin-card"><h3 data-i18n="total_gross">Total Gross</h3><div class="amount">₹<span id="stat-gross">0</span></div></div>
    </div>

    <h2 class="section-title" data-i18n="active_floor">Active Floor Operations</h2>
    <div class="grid" id="tables-grid"></div>
  </div>

  <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
  <audio id="cash-sound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { getDatabase, ref, onValue, update, remove, increment } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBKJxglt7aeg7uZ7jxNzX5aaIX0gJSIrQ",
      authDomain: "fusionmandi999-36066.firebaseapp.com",
      databaseURL: "https://fusionmandi999-36066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "fusionmandi999-36066",
      storageBucket: "fusionmandi999-36066.firebasestorage.app",
      messagingSenderId: "312237706440",
      appId: "1:312237706440:web:f58610144c8e06a32ce9fd",
      measurementId: "G-1LM1V9NLMB"
    };

    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwXvoOUsaQeKy8tjGuOkYunnK8hau3LJNCt3PUn1g0Ar6pD35jaX32_dZ_7uXRdSQRYUg/exec";

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const alertSound = document.getElementById('alert-sound');
    const cashSound = document.getElementById('cash-sound');

    // --- Multi-Language Dictionary ---
    const dict = {
      en: {
        pos_access: "POS Access",
        pin_placeholder: "Enter PIN / Password",
        login_btn: "Login",
        login_hint: "Admin (admin123) or Waiter (waiter123)",
        command_center: "Command Center",
        lock_screen: "Lock Screen",
        cash_earned: "Cash Earned",
        online_earned: "Online Earned",
        total_gross: "Total Gross",
        active_floor: "Active Floor Operations",
        waiting_orders: "Floor is clear. Waiting for orders...",
        print_kot: "Print KOT",
        clear_alerts: "Clear Alerts",
        cash_collected: "Mark Cash Collected",
        clear_finalize: "Clear & Finalize",
        plate_empty: "Plate is empty",
        customer_needs_help: "🚨 Customer Needs Help",
        total: "Total:",
        active_status: "Active",
        verify_upi: "VERIFY UPI📱",
        cash_pending: "CASH PENDING 🤵",
        at_counter: "AT COUNTER 🏪",
        invalid_pass: "Invalid Password",
        admin_notified: "Admin notified. Please hand cash to the counter."
      },
      hi: {
        pos_access: "POS एक्सेस",
        pin_placeholder: "पिन / पासवर्ड दर्ज करें",
        login_btn: "लॉग इन",
        login_hint: "एडमिन (admin123) या वेटर (waiter123)",
        command_center: "कमांड सेंटर",
        lock_screen: "स्क्रीन लॉक करें",
        cash_earned: "नकद कमाई",
        online_earned: "ऑनलाइन कमाई",
        total_gross: "कुल कमाई",
        active_floor: "सक्रिय फ्लोर",
        waiting_orders: "फ्लोर खाली है। ऑर्डर की प्रतीक्षा में...",
        print_kot: "KOT प्रिंट करें",
        clear_alerts: "अलर्ट हटाएं",
        cash_collected: "नकद प्राप्त हुआ",
        clear_finalize: "क्लियर और फाइनल करें",
        plate_empty: "प्लेट खाली है",
        customer_needs_help: "🚨 ग्राहक को मदद चाहिए",
        total: "कुल:",
        active_status: "सक्रिय",
        verify_upi: "UPI जांचें📱",
        cash_pending: "नकद बाकी 🤵",
        at_counter: "काउंटर पर 🏪",
        invalid_pass: "अमान्य पासवर्ड",
        admin_notified: "एडमिन को सूचित कर दिया गया। कृपया काउंटर पर नकद जमा करें।"
      },
      te: {
        pos_access: "POS యాక్సెస్",
        pin_placeholder: "పిన్ / పాస్‌వర్డ్ నమోదు చేయండి",
        login_btn: "లాగిన్",
        login_hint: "అడ్మిన్ (admin123) లేదా వెయిటర్ (waiter123)",
        command_center: "కమాండ్ సెంటర్",
        lock_screen: "స్క్రీన్ లాక్ చేయండి",
        cash_earned: "నగదు సంపాదన",
        online_earned: "ఆన్‌లైన్ సంపాదన",
        total_gross: "మొత్తం సంపాదన",
        active_floor: "యాక్టివ్ టేబుల్స్",
        waiting_orders: "ఫ్లోర్ ఖాళీగా ఉంది. ఆర్డర్ల కోసం వేచి ఉంది...",
        print_kot: "KOT ప్రింట్ చేయండి",
        clear_alerts: "అలర్ట్స్ క్లియర్ చేయండి",
        cash_collected: "నగదు స్వీకరించబడింది",
        clear_finalize: "క్లియర్ & ఫైనలైజ్",
        plate_empty: "ప్లేట్ ఖాళీగా ఉంది",
        customer_needs_help: "🚨 కస్టమర్‌కు సహాయం కావాలి",
        total: "మొత్తం:",
        active_status: "యాక్టివ్",
        verify_upi: "UPI సరిచూసుకోండి📱",
        cash_pending: "నగదు పెండింగ్ 🤵",
        at_counter: "కౌంటర్ వద్ద 🏪",
        invalid_pass: "తప్పు పాస్‌వర్డ్",
        admin_notified: "అడ్మిన్‌కు తెలియజేయబడింది. దయచేసి నగదును కౌంటర్‌లో ఇవ్వండి."
      }
    };

    let currentLang = 'en';
    const t = (key) => dict[currentLang][key] || key;

    let globalTableData = null; // Store data to re-render on language change
    let currentRole = null;
    let todayDateString = new Date().toISOString().split('T')[0];

    window.changeLang = (lang) => {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
      if (globalTableData !== null) renderTables(globalTableData);
    };

    window.changeLang('en');

    // Enter Key Login
    document.getElementById('pin-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') attemptLogin();
    });

    window.attemptLogin = () => {
      const pin = document.getElementById('pin-input').value;
      if (pin === 'admin123') {
        currentRole = 'admin';
        document.getElementById('ui-role-badge').innerText = 'ADMIN';
        document.getElementById('admin-financials').style.display = 'grid';
      } else if (pin === 'waiter123') {
        currentRole = 'waiter';
        document.getElementById('ui-role-badge').innerText = 'WAITER';
        document.getElementById('ui-role-badge').style.backgroundColor = 'var(--waiter)';
      } else {
        return alert(t('invalid_pass'));
      }
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-dashboard').style.display = 'block';
      loadData();
    };

    function loadData() {
      onValue(ref(db, 'active_tables'), (snapshot) => {
        globalTableData = snapshot.val();
        renderTables(globalTableData);
      });

      if (currentRole === 'admin') {
        onValue(ref(db, `daily_totals/${todayDateString}`), (snapshot) => {
          const totals = snapshot.val() || { cash: 0, online: 0, gross: 0 };
          document.getElementById('stat-cash').innerText = totals.cash;
          document.getElementById('stat-online').innerText = totals.online;
          document.getElementById('stat-gross').innerText = totals.gross;
        });
      }
    }

    function renderTables(tables) {
      const grid = document.getElementById('tables-grid');
      grid.innerHTML = '';
      let playAlarm = false;

      if (tables) {
        Object.keys(tables).forEach(tableId => {
          const data = tables[tableId];
          const hasAlert = data.help_requested || data.bill_requested;
          if (hasAlert) playAlarm = true;

          let itemsHTML = '';
          let pendingKOTCount = 0;
          let itemsTextForSheet = [];

          if (data.items) {
            Object.keys(data.items).forEach(itemKey => {
              const i = data.items[itemKey];
              if (i.kot_status === 'pending') pendingKOTCount++;
              itemsHTML += `<li class="${i.kot_status === 'pending' ? 'pending-kot' : 'printed-kot'}"><span><b>${i.quantity}x</b> ${i.name} <br><small>${i.variant}</small></span><span style="font-size:1.1rem;">₹${i.subtotal}</span></li>`;
              itemsTextForSheet.push(`${i.quantity}x ${i.name} (${i.variant})`);
            });
          }

          let cardClass = "table-card";
          if (hasAlert) cardClass += " alert";
          let statusText = t('active_status');
          
          if (data.payment_method === 'upi') { cardClass += " upi-pending"; statusText = t('verify_upi'); }
          else if (data.payment_method === 'cash') { cardClass += " cash-pending"; statusText = t('cash_pending'); }
          else if (data.payment_method === 'counter') { statusText = t('at_counter'); }

          const card = document.createElement('div');
          card.className = cardClass;
          card.innerHTML = `
            <div class="table-header">
              <h2>${tableId.toUpperCase()}</h2>
              <span class="status-badge">${statusText}</span>
            </div>
            <div style="margin-bottom:12px; color:#aaa; font-size:0.9rem; border-bottom:1px solid #444; padding-bottom:10px;">📞 Mobile: ${data.customer_mobile || 'None'}</div>
            
            ${data.help_requested ? `<div style="color:#e74c3c; font-weight:bold; margin-bottom:10px;">${t('customer_needs_help')}</div>` : ''}
            
            <ul class="items-list">${itemsHTML || `<li>${t('plate_empty')}</li>`}</ul>
            
            <div class="total-row"><span>${t('total')}</span><span>₹${data.running_total || 0}</span></div>
            
            <div class="actions">
              ${pendingKOTCount > 0 ? `<button class="btn-kot" onclick="printKOT('${tableId}')">${t('print_kot')} (${pendingKOTCount})</button>` : ''}
              ${hasAlert ? `<button class="btn-resolve" onclick="resolveAlerts('${tableId}')">${t('clear_alerts')}</button>` : ''}
              ${currentRole === 'waiter' && data.payment_method === 'cash' ? `<button class="btn-waiter-cash" style="display:block;" onclick="notifyCashCollected('${tableId}')">${t('cash_collected')}</button>` : ''}
              ${currentRole === 'admin' ? `<button class="btn-clear" style="display:block;" onclick="clearTable('${tableId}', ${data.running_total \vert{}\vert{} 0}, '${itemsTextForSheet.join(' | ')}', '${data.payment_method \vert{}\vert{} 'unknown'}')">${t('clear_finalize')}</button>` : ''}
            </div>
          `;
          grid.appendChild(card);
        });
        if (playAlarm) alertSound.play().catch(()=>{}); else { alertSound.pause(); alertSound.currentTime = 0; }
      } else {
        grid.innerHTML = `<p style="color:#aaa; font-size:1.1rem; padding:10px;">${t('waiting_orders')}</p>`;
      }
    }

    window.printKOT = function(tableId) {
      const itemsRef = ref(db, `active_tables/${tableId}/items`);
      onValue(itemsRef, (snap) => {
        const items = snap.val();
        if (items) {
          let updates = {};
          Object.keys(items).forEach(key => { updates[`${key}/kot_status`] = "printed"; });
          update(itemsRef, updates);
        }
      }, { onlyOnce: true });
    };

    window.resolveAlerts = function(tableId) {
      update(ref(db, `active_tables/${tableId}`), { help_requested: false, bill_requested: false });
    };

    window.notifyCashCollected = function(tableId) {
      alert(t('admin_notified'));
      update(ref(db, `active_tables/${tableId}`), { payment_method: "cash_collected_by_waiter" });
    };

    window.clearTable = async function(tableId, total, itemsDetails, method) {
      if(!confirm(`Clear Table ${tableId.toUpperCase()}?`)) return;
      cashSound.play();
      let finMethod = method === 'upi' ? 'online' : 'cash';
      
      const totalsRef = ref(db, `daily_totals/${todayDateString}`);
      update(totalsRef, { [finMethod]: increment(total), gross: increment(total) });

      try {
        const payload = {
          orderId: Date.now().toString(),
          tableNo: tableId,
          totalAmount: total,
          paymentMethod: method.toUpperCase(),
          itemsDetails: itemsDetails || "Empty"
        };
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
      } catch (err) { console.error("Sheet Log Failed"); }
      remove(ref(db, `active_tables/${tableId}`));
    };
  </script>
</body>
</html>
