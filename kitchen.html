<!-- kitchen.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandi POS - Command Center</title>
  <style>
    :root { --admin: #e74c3c; --waiter: #3498db; --bg: #1e272e; --card: #2f3640; --text: #f5f6fa; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: var(--text); }
    
    #login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .login-box { background: var(--card); padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 5px solid var(--admin); width: 300px; }
    .login-box input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 6px; border: none; font-size: 1.1rem; text-align: center; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #2ecc71; color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    
    header { background: #111; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #444; }
    .role-badge { background: var(--admin); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    .btn-logout { background: transparent; border: 1px solid #ccc; color: #ccc; padding: 5px 15px; border-radius: 4px; cursor: pointer; }
    
    .financials { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; background: #222; }
    .fin-card { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid #2ecc71; }
    .fin-card h3 { margin: 0; font-size: 1rem; color: #aaa; text-transform: uppercase; }
    .fin-card .amount { font-size: 1.8rem; font-weight: 900; color: #2ecc71; margin-top: 5px; }

    .section-title { padding: 20px 20px 0; margin: 0; font-size: 1.2rem; color: #aaa; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 20px; }
    .table-card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-top: 5px solid #7f8fa6; position: relative; }
    .table-card.alert { border-top-color: #e74c3c; animation: flash 1s infinite alternate; }
    .table-card.upi-pending { border-top-color: #9b59b6; }
    .table-card.cash-pending { border-top-color: #f1c40f; }
    
    .table-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; }
    .table-header h2 { margin: 0; font-size: 1.5rem; }
    .status-badge { font-size: 0.8rem; padding: 3px 8px; border-radius: 4px; background: #555; }
    
    .items-list { margin: 0; padding: 0; list-style: none; max-height: 200px; overflow-y: auto; }
    .items-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #3d464d; font-size: 0.95rem; }
    .pending-kot { color: #f39c12; font-weight: bold; }
    .printed-kot { color: #95a5a6; }
    
    .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: bold; color: #2ecc71; margin: 15px 0; }
    
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .actions button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
    .btn-kot { background: #e67e22; }
    .btn-clear { background: #2ecc71; display: none; }
    .btn-waiter-cash { background: #3498db; display: none; }
    .btn-resolve { background: #e74c3c; }

    @keyframes flash { from { box-shadow: 0 0 10px #e74c3c; } to { box-shadow: 0 0 25px #e74c3c; } }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>POS Access</h2>
      <input type="password" id="pin-input" placeholder="Enter PIN / Password" autofocus>
      <button onclick="attemptLogin()">Login</button>
      <p style="color:#aaa; font-size:0.8rem; margin-top:15px;">Admin (admin123) or Waiter (waiter123)</p>
    </div>
  </div>

  <div id="main-dashboard" style="display: none;">
    <header>
      <div>
        <span class="role-badge" id="ui-role-badge">WAITING</span>
        <strong style="margin-left: 10px; font-size: 1.2rem;">Command Center</strong>
      </div>
      <button class="btn-logout" onclick="location.reload()">Lock Screen</button>
    </header>

    <div class="financials" id="admin-financials">
      <div class="fin-card"><h3>Cash Earned</h3><div class="amount">₹<span id="stat-cash">0</span></div></div>
      <div class="fin-card"><h3>Online Earned</h3><div class="amount">₹<span id="stat-online">0</span></div></div>
      <div class="fin-card"><h3>Total Gross</h3><div class="amount">₹<span id="stat-gross">0</span></div></div>
    </div>

    <h2 class="section-title">Active Floor Operations</h2>
    <div class="grid" id="tables-grid"></div>
  </div>

  <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
  <audio id="cash-sound" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { getDatabase, ref, onValue, update, remove, increment } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBKJxglt7aeg7uZ7jxNzX5aaIX0gJSIrQ",
      authDomain: "fusionmandi999-36066.firebaseapp.com",
      databaseURL: "https://fusionmandi999-36066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "fusionmandi999-36066",
      storageBucket: "fusionmandi999-36066.firebasestorage.app",
      messagingSenderId: "312237706440",
      appId: "1:312237706440:web:f58610144c8e06a32ce9fd",
      measurementId: "G-1LM1V9NLMB"
    };

    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwXvoOUsaQeKy8tjGuOkYunnK8hau3LJNCt3PUn1g0Ar6pD35jaX32_dZ_7uXRdSQRYUg/exec";

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const alertSound = document.getElementById('alert-sound');
    const cashSound = document.getElementById('cash-sound');

    let currentRole = null;
    let todayDateString = new Date().toISOString().split('T')[0];

    window.attemptLogin = () => {
      const pin = document.getElementById('pin-input').value;
      if (pin === 'admin123') {
        currentRole = 'admin';
        document.getElementById('ui-role-badge').innerText = 'ADMIN';
        document.getElementById('admin-financials').style.display = 'grid';
      } else if (pin === 'waiter123') {
        currentRole = 'waiter';
        document.getElementById('ui-role-badge').innerText = 'WAITER';
        document.getElementById('ui-role-badge').style.backgroundColor = 'var(--waiter)';
      } else {
        return alert('Invalid Password');
      }
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-dashboard').style.display = 'block';
      loadData();
    };

    function loadData() {
      onValue(ref(db, 'active_tables'), (snapshot) => {
        const tables = snapshot.val();
        const grid = document.getElementById('tables-grid');
        grid.innerHTML = '';
        let playAlarm = false;

        if (tables) {
          Object.keys(tables).forEach(tableId => {
            const data = tables[tableId];
            const hasAlert = data.help_requested || data.bill_requested;
            if (hasAlert) playAlarm = true;

            let itemsHTML = '';
            let pendingKOTCount = 0;
            let itemsTextForSheet = [];

            if (data.items) {
              Object.keys(data.items).forEach(itemKey => {
                const i = data.items[itemKey];
                if (i.kot_status === 'pending') pendingKOTCount++;
                itemsHTML += `<li class="${i.kot_status === 'pending' ? 'pending-kot' : 'printed-kot'}"><span>${i.quantity}x ${i.name} (${i.variant})</span><span>₹${i.subtotal}</span></li>`;
                itemsTextForSheet.push(`${i.quantity}x ${i.name} (${i.variant})`);
              });
            }

            let cardClass = "table-card";
            if (hasAlert) cardClass += " alert";
            let statusText = "Active";
            if (data.payment_method === 'upi') { cardClass += " upi-pending"; statusText = "VERIFY UPI📱"; }
            else if (data.payment_method === 'cash') { cardClass += " cash-pending"; statusText = "CASH PENDING 🤵"; }

            const card = document.createElement('div');
            card.className = cardClass;
            card.innerHTML = `
              <div class="table-header">
                <h2>${tableId.toUpperCase()}</h2>
                <span class="status-badge">${statusText}</span>
              </div>
              <div style="margin-bottom:10px; color:#aaa; font-size:0.9rem;">📞 Mobile: ${data.customer_mobile || 'None'}</div>
              <ul class="items-list">${itemsHTML || '<li>Plate is empty</li>'}</ul>
              <div class="total-row"><span>Total:</span><span>₹${data.running_total || 0}</span></div>
              <div class="actions">
                ${pendingKOTCount > 0 ? `<button class="btn-kot" onclick="printKOT('${tableId}')">Print KOT (${pendingKOTCount})</button>` : ''}
                ${hasAlert ? `<button class="btn-resolve" onclick="resolveAlerts('${tableId}')">Clear Alerts</button>` : ''}
                ${currentRole === 'waiter' && data.payment_method === 'cash' ? `<button class="btn-waiter-cash" style="display:block;" onclick="notifyCashCollected('${tableId}')">Cash Collected</button>` : ''}
                ${currentRole === 'admin' ? `<button class="btn-clear" style="display:block;" onclick="clearTable('${tableId}',${data.running_total || 0}, '${itemsTextForSheet.join(' \vert{} ')}', '${data.payment_method || 'unknown'}')">Clear & Finalize</button>` : ''}
              </div>
            `;
            grid.appendChild(card);
          });
          if (playAlarm) alertSound.play().catch(()=>{}); else { alertSound.pause(); alertSound.currentTime = 0; }
        } else {
          grid.innerHTML = '<p style="color:#aaa;">Floor is clear. Waiting for orders...</p>';
        }
      });

      if (currentRole === 'admin') {
        onValue(ref(db, `daily_totals/${todayDateString}`), (snapshot) => {
          const totals = snapshot.val() || { cash: 0, online: 0, gross: 0 };
          document.getElementById('stat-cash').innerText = totals.cash;
          document.getElementById('stat-online').innerText = totals.online;
          document.getElementById('stat-gross').innerText = totals.gross;
        });
      }
    }

    window.printKOT = function(tableId) {
      const itemsRef = ref(db, `active_tables/${tableId}/items`);
      onValue(itemsRef, (snap) => {
        const items = snap.val();
        if (items) {
          let updates = {};
          Object.keys(items).forEach(key => { updates[`${key}/kot_status`] = "printed"; });
          update(itemsRef, updates);
        }
      }, { onlyOnce: true });
    };

    window.resolveAlerts = function(tableId) {
      update(ref(db, `active_tables/${tableId}`), { help_requested: false, bill_requested: false });
    };

    window.notifyCashCollected = function(tableId) {
      alert("Admin notified. Please hand cash to the counter.");
      update(ref(db, `active_tables/${tableId}`), { payment_method: "cash_collected_by_waiter" });
    };

    window.clearTable = async function(tableId, total, itemsDetails, method) {
      if(!confirm(`Verify payment and Clear Table ${tableId.toUpperCase()}?`)) return;
      cashSound.play();
      let finMethod = method === 'upi' ? 'online' : 'cash';
      
      const totalsRef = ref(db, `daily_totals/${todayDateString}`);
      update(totalsRef, { [finMethod]: increment(total), gross: increment(total) });

      try {
        const payload = {
          orderId: Date.now().toString(),
          tableNo: tableId,
          totalAmount: total,
          paymentMethod: method.toUpperCase(),
          itemsDetails: itemsDetails || "Empty"
        };
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
      } catch (err) { console.error("Sheet Log Failed"); }
      remove(ref(db, `active_tables/${tableId}`));
    };
  </script>
</body>
</html>
