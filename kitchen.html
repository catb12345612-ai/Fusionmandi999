<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodDesk Admin - Fusion Mandi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#ff7529', sidebar: '#1e1e2d', light: '#f4f5f8', card: '#ffffff' } } } }
  </script>
  <style>
    @media print { body * { visibility: hidden; } #printArea, #printArea * { visibility: visible; } #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 0; } .no-print { display: none !important; } }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .dash-card { box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.03); }
    body { background-color: #f4f5f8; }
    
    @keyframes redBlueFlash {
      0% { box-shadow: inset 0 0 0 10px #ef4444; border-color: #ef4444; }
      50% { box-shadow: inset 0 0 0 10px #3b82f6; border-color: #3b82f6; }
      100% { box-shadow: inset 0 0 0 10px #ef4444; border-color: #ef4444; }
    }
    .urgent-alarm { animation: redBlueFlash 1s infinite; }
  </style>
</head>
<body class="font-sans antialiased text-slate-800">

  <!-- Login Modal -->
  <div id="loginScreen" class="fixed inset-0 bg-sidebar z-[100] flex flex-col items-center justify-center p-5">
    <div class="bg-card p-10 rounded-3xl text-center w-full max-w-sm shadow-2xl">
      <div class="w-16 h-16 bg-primary/10 text-primary rounded-xl flex items-center justify-center mx-auto mb-6 text-2xl font-black">FM</div>
      <h2 class="text-2xl font-black text-slate-900 mb-2">Workspace Login</h2>
      <input type="password" id="sysPin" placeholder="Enter PIN" class="w-full text-center p-4 bg-light border-none rounded-xl font-black text-xl outline-none mb-4 tracking-widest">
      <button onclick="attemptLogin()" class="w-full bg-primary text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition-transform">ACCESS DASHBOARD</button>
      <p class="text-xs text-slate-400 mt-5 font-medium">Admin: admin123 | Waiter: waiter123</p>
    </div>
  </div>

  <div class="flex h-screen overflow-hidden hidden" id="mainLayout">
    <!-- Sidebar -->
    <aside class="w-64 bg-sidebar text-white flex flex-col no-print shadow-xl z-20">
      <div class="p-6 border-b border-white/5">
        <h1 class="font-black text-lg">Fusion Mandi Admin</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Role: <span id="roleText">Waitstaff</span></p>
      </div>
      <nav class="flex-1 px-4 py-4 space-y-2">
        <button onclick="switchTab('orders')" id="tab-orders" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm bg-primary/10 text-primary tab-btn">📦 Floor Operations</button>
        <button onclick="switchTab('inventory')" id="tab-inventory" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-white/5 tab-btn admin-only hidden">🍔 Menu & Stock</button>
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-white/5 tab-btn admin-only hidden">📈 Analytics</button>
      </nav>
      <div class="p-4 border-t border-white/5">
        <button onclick="location.reload()" class="w-full bg-red-500/10 text-red-500 font-bold py-3 rounded-xl">Log Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-light relative" id="mainContent">
      <div class="p-8 pb-32">
        
        <!-- LIVE ORDERS -->
        <section id="view-orders" class="tab-section">
          <h2 class="text-2xl font-black text-slate-900 mb-8 tracking-tight">Active Floor (Running Tabs)</h2>
          <div id="kitchenGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- INVENTORY -->
        <section id="view-inventory" class="tab-section hidden no-print">
          <h2 class="text-2xl font-black text-slate-900 mb-8 tracking-tight">Inventory Management</h2>
          <div id="inventoryList" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
        </section>

        <!-- DASHBOARD -->
        <section id="view-dashboard" class="tab-section hidden">
          <div class="flex justify-between items-center mb-8 no-print">
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">Dashboard & Revenue</h2>
            <button onclick="window.print()" class="bg-white text-slate-800 border border-slate-200 px-5 py-2.5 rounded-xl font-bold">🖨️ Export PDF</button>
          </div>
          <div id="printArea" class="bg-card p-8 rounded-3xl dash-card">
            <div class="mb-10">
              <p class="text-[10px] font-black text-primary uppercase tracking-widest mb-1">Today's Revenue</p>
              <p id="tallyDaily" class="text-4xl font-black text-slate-900">₹0</p>
            </div>
            <div class="mb-10">
              <h3 class="text-lg font-black text-slate-900 mb-6 border-b border-slate-100 pb-3">Completed Transactions</h3>
              <table class="w-full text-left text-sm border-collapse">
                <thead class="bg-light text-slate-500 uppercase font-black text-[10px] tracking-widest">
                  <tr><th class="p-4">Time</th><th class="p-4">Table</th><th class="p-4 w-1/2">Order Details</th><th class="p-4 text-right">Amount</th></tr>
                </thead>
                <tbody id="dailyLogsTable" class="divide-y divide-slate-100"></tbody>
              </table>
            </div>
            <div class="mt-16 pt-8 border-t border-slate-100 text-center no-print">
              <button onclick="factoryResetSystem()" class="bg-red-50 text-red-600 border border-red-100 px-8 py-4 rounded-2xl font-black text-sm uppercase tracking-widest">⚠️ FACTORY RESET: Load Full 22-Item Database</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBKJxglt7aeg7uZ7jxNzX5aaIX0gJSIrQ", authDomain: "fusionmandi999-36066.firebaseapp.com", databaseURL: "https://fusionmandi999-36066-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "fusionmandi999-36066", storageBucket: "fusionmandi999-36066.firebasestorage.app", messagingSenderId: "312237706440", appId: "1:312237706440:web:f58610144c8e06a32ce9fd"
    };
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbytjijowQXIR4AfQxHtJt4PkYhiy7-RYqEZmp6QTF61QIbTG5xV0R1Aor8-wYqRx1ZVCQ/exec";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentRole = null;
    let alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    let alarmTimer = null;

    window.attemptLogin = function() {
      const pin = document.getElementById('sysPin').value;
      if (pin === 'admin123') { currentRole = 'admin'; }
      else if (pin === 'waiter123') { currentRole = 'waiter'; }
      else { return alert("Invalid PIN"); }
      
      try { alertSound.play().then(()=>{alertSound.pause();alertSound.currentTime=0;}).catch(()=>{}); } catch(e){}
      
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainLayout').classList.remove('hidden');
      document.getElementById('roleText').innerText = currentRole === 'admin' ? 'Administrator' : 'Floor Waitstaff';
      
      if(currentRole === 'admin') { document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden')); }
      loadSystem();
    }

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => {
        if(b.id === `tab-${tab}`) b.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm bg-primary/10 text-primary tab-btn";
        else b.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-white/5 tab-btn admin-only" + (currentRole !== 'admin' ? ' hidden' : '');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
    }

    function triggerAlarm() {
      if(currentRole !== 'admin') return;
      alertSound.play().catch(()=>{});
      
      // Stop after 10 seconds
      setTimeout(() => { alertSound.pause(); alertSound.currentTime = 0; }, 10000);
    }

    function loadSystem() {
      db.ref('active_tables').on('value', snap => {
        const grid = document.getElementById('kitchenGrid'); grid.innerHTML = '';
        const tables = snap.val() || {};
        let needsAttention = false;
        
        Object.entries(tables).sort((a,b)=>a[1].timestamp-b[1].timestamp).forEach(([id, table]) => {
          if(table.status === 'pending' || table.status === 'bill_requested') needsAttention = true;

          let border = table.status==='pending'?'urgent-alarm':(table.status==='bill_requested'?'urgent-alarm border-amber-500':'border-blue-500');
          
          let btn = '';
          if (currentRole === 'admin') {
            if(table.status === 'pending') { 
              btn = `<button class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-black" onclick="printKOT('${id}')">Print KOT (Ack Order)</button>`; 
            } else if(table.status === 'bill_requested') { 
              btn = `<button class="w-full bg-emerald-500 text-white py-3.5 rounded-xl font-black" onclick="generateBill('${id}')">Show QR Code</button>`; 
            } else { 
              btn = `<button class="w-full bg-dark text-white py-3.5 rounded-xl font-black" onclick="clearTable('${id}')">Clear & Log Sale (${table.paymentMethod || 'CASH'})</button>`; 
            }
          } else {
            // Waiter Role Limits
            if(table.status === 'pending' || table.status === 'cooking') {
              btn = `<button class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-black" onclick="waiterRequestBill('${id}')">Request Bill</button>`;
            } else if(table.status === 'bill_requested') {
              btn = `<button class="w-full bg-emerald-500 text-white py-3.5 rounded-xl font-black" onclick="waiterCashCollect('${id}')">Mark Cash Collected</button>`;
            } else {
              btn = `<button class="w-full bg-light text-slate-400 py-3.5 rounded-xl font-black" disabled>Awaiting Admin Clear</button>`;
            }
          }

          grid.innerHTML += `
            <div class="dash-card bg-card p-6 rounded-3xl border-4 ${border} flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                  <span class="font-black text-2xl text-slate-900">Table ${table.table}</span>
                  <span class="text-[10px] font-black uppercase bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg">${table.status.replace('_',' ')}</span>
                </div>
                <p class="font-semibold text-slate-600 text-sm leading-relaxed mb-4">${(table.items||"").replace(/ \| /g,'<br>• ')}</p>
              </div>
              <div class="mt-2 pt-4 border-t border-slate-100">
                <div class="flex justify-between items-end mb-5">
                  <span class="text-xs font-bold text-slate-400 bg-light px-2 py-1 rounded-md">📞 ${table.phone}</span>
                  <span class="font-black text-2xl text-slate-900 tracking-tight">₹${table.total}</span>
                </div>
                ${btn}
              </div>
            </div>`;
        });

        // 30 Second Reminder Loop for Admins
        if(needsAttention) {
          triggerAlarm();
          if(!alarmTimer) alarmTimer = setInterval(triggerAlarm, 30000);
        } else {
          clearInterval(alarmTimer); alarmTimer = null;
          alertSound.pause(); alertSound.currentTime = 0;
        }
      });

      if(currentRole === 'admin') {
        db.ref('menu').on('value', snap => {
          const list = document.getElementById('inventoryList'); list.innerHTML = '';
          Object.entries(snap.val()||{}).forEach(([id, item]) => {
            list.innerHTML += `
              <div class="dash-card bg-card p-4 rounded-2xl flex items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                  <img src="${item.image_url}" class="w-14 h-14 rounded-xl object-cover shadow-sm">
                  <div>
                    <h4 class="font-black text-sm text-slate-900">${item.name}</h4>
                    <p class="text-[10px] font-black text-slate-400 uppercase">${item.category}</p>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <button onclick="toggleSpec('${id}', ${item.is_special||false})" class="px-3 py-2 rounded-lg text-xs font-bold ${item.is_special?'bg-amber-100 text-amber-700':'bg-light text-slate-500'}">⭐</button>
                  <div class="flex items-center bg-light rounded-lg overflow-hidden p-1">
                    <span class="px-2 text-[10px] font-black text-slate-400">Qty</span>
                    <input type="number" id="stock-${id}" value="${item.stock_count||0}" class="w-12 p-1 font-black text-center outline-none bg-transparent">
                  </div>
                  <button onclick="updStock('${id}')" class="bg-primary text-white px-4 py-2.5 rounded-lg font-black text-xs">Save</button>
                </div>
              </div>`;
          });
        });

        const dStr = new Date().toISOString().split('T')[0];
        db.ref(`tallies/daily/${dStr}`).on('value', s => document.getElementById('tallyDaily').innerText = `₹${s.val()||0}`);
        db.ref(`daily_logs/${dStr}`).on('value', snap => {
          const tb = document.getElementById('dailyLogsTable'); tb.innerHTML = '';
          Object.values(snap.val()||{}).forEach(log => {
            tb.innerHTML += `<tr class="hover:bg-light/50"><td class="p-4 font-medium text-slate-500">${log.time}</td><td class="p-4 font-black">T-${log.table}</td><td class="p-4 text-xs font-semibold text-slate-600">${log.items}</td><td class="p-4 font-black text-right text-emerald-600">₹${log.total}</td></tr>`;
          });
        });
      }
    }

    // Admin Functions
    window.printKOT = function(id) { db.ref('active_tables/'+id).update({status: 'cooking'}); };
    window.generateBill = function(id) { db.ref('active_tables/'+id).update({status: 'bill_ready'}); };
    window.toggleSpec = function(id, st) { db.ref('menu/'+id).update({is_special: !st}); };
    window.updStock = function(id) { db.ref('menu/'+id).update({stock_count: parseInt(document.getElementById(`stock-${id}`).value)||0}); };

    window.clearTable = async function(id) {
      if(!confirm("Finalize Table and Log Revenue?")) return;
      const snap = await db.ref('active_tables/'+id).once('value'); const tableData = snap.val(); if(!tableData) return;
      const d = new Date().toISOString().split('T')[0];
      
      db.ref(`tallies/daily/${d}`).transaction(v => (v||0)+Number(tableData.total));
      db.ref(`daily_logs/${d}/${tableData.orderId}`).set({ time: new Date().toLocaleTimeString(), table: tableData.table, phone: tableData.phone, items: tableData.items, total: tableData.total });
      
      const sheetPayload = { orderId: tableData.orderId, tableNo: tableData.table, phone: tableData.phone, totalAmount: tableData.total, paymentMethod: tableData.paymentMethod || "CASH", itemsDetails: tableData.items };
      fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(sheetPayload) });
      db.ref('active_tables/'+id).remove();
    }

    // Waiter Functions
    window.waiterRequestBill = function(id) { db.ref('active_tables/'+id).update({status: 'bill_requested', paymentMethod: 'WAITER_COLLECT'}); };
    window.waiterCashCollect = function(id) { db.ref('active_tables/'+id).update({status: 'bill_ready', paymentMethod: 'CASH_COLLECTED'}); alert("Admin notified of cash collection."); };
