<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Mandi Croods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#D4AF37', dark: '#0a0a0a', sidebar: '#0F1014', card: '#161821' } } } }
  </script>
  <style>
    @media print { body * { visibility: hidden; } #printArea, #printArea * { visibility: visible; } #printArea { position: absolute; left: 0; top: 0; width: 100%; color:black; background:white;} .no-print { display: none !important; } }
    .hide-scroll::-webkit-scrollbar { display: none; }
    body { background-color: #0d0f14; color: #fff; } /* Dark Figma Theme */
    .glass-card { background: rgba(22, 24, 33, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
    .gold-gradient { background: linear-gradient(135deg, #F9E596, #D4AF37, #AA8C2C); }
    .neon-text { text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
  </style>
</head>
<body class="font-sans antialiased">

  <div id="loginScreen" class="fixed inset-0 bg-sidebar z-[100] flex flex-col items-center justify-center p-5">
    <div class="bg-[#141414] border border-primary/30 p-10 rounded-3xl text-center w-full max-w-sm shadow-[0_15px_50px_rgba(212,175,55,0.15)]">
      <h2 class="text-2xl font-black text-primary mb-6 tracking-tight">System Login</h2>
      <input type="password" id="sysPin" placeholder="Enter PIN" onkeydown="if(event.key==='Enter') attemptLogin()" class="w-full text-center p-4 bg-white/5 border border-white/20 text-white rounded-xl font-black text-xl outline-none mb-4">
      <button onclick="attemptLogin()" class="w-full gold-gradient text-black font-black py-4 rounded-xl">ACCESS WORKSPACE</button>
    </div>
  </div>

  <div class="flex h-screen overflow-hidden hidden" id="mainLayout">
    <!-- Sidebar -->
    <aside class="w-64 bg-sidebar flex flex-col no-print border-r border-white/10">
      <div class="p-6 border-b border-white/10">
        <h1 class="font-black text-xl leading-tight text-primary">Mandi Croods</h1>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Role: <span id="roleText" class="text-white"></span></p>
      </div>
      <nav class="flex-1 px-4 py-4 space-y-2 overflow-y-auto">
        <button onclick="switchTab('orders')" id="tab-orders" class="w-full text-left px-4 py-3 rounded-xl font-bold text-sm bg-primary/20 text-primary border border-primary/50 tab-btn">📦 Active Floor</button>
        <button onclick="switchTab('inventory')" id="tab-inventory" class="w-full text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-white/5 tab-btn admin-only">🍔 Menu & Inventory</button>
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="w-full text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-white/5 tab-btn admin-only">📈 Analytics Dashboard</button>
      </nav>
      <div class="p-4 border-t border-white/10">
        <button onclick="location.reload()" class="w-full bg-red-500/10 text-red-500 font-bold py-3 rounded-xl hover:bg-red-500 hover:text-white transition-all text-sm">Log Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-8 relative">
      
      <!-- Floor Operations -->
      <section id="view-orders" class="tab-section">
        <h2 class="text-3xl font-black text-white mb-6">Floor Operations</h2>
        <div id="kitchenGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
      </section>

      <!-- Inventory -->
      <section id="view-inventory" class="tab-section hidden">
        <h2 class="text-3xl font-black text-white mb-6">Inventory Management</h2>
        
        <div class="glass-card p-6 mb-8 border-t-4 border-primary">
          <h3 class="text-lg font-black mb-4">Add New Item / Upload Photo</h3>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div><label class="text-[10px] uppercase text-slate-400">Name</label><input type="text" id="newItemName" class="w-full p-2.5 bg-dark rounded border border-white/20 outline-none"></div>
            <div><label class="text-[10px] uppercase text-slate-400">Price</label><input type="number" id="newItemPrice" class="w-full p-2.5 bg-dark rounded border border-white/20 outline-none"></div>
            <div>
              <label class="text-[10px] uppercase text-slate-400">Direct Photo Upload</label>
              <input type="file" id="newItemImageFile" accept="image/*" class="w-full p-2 text-xs bg-dark rounded border border-white/20 outline-none text-slate-400">
            </div>
            <div><button onclick="addNewMenuItem()" class="w-full bg-primary text-black font-black py-3 rounded shadow">Add Item</button></div>
          </div>
        </div>

        <div id="inventoryList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
      </section>

      <!-- Premium Dashboard -->
      <section id="view-dashboard" class="tab-section hidden">
        <div class="flex justify-between items-center mb-8 no-print">
          <h2 class="text-3xl font-black text-white neon-text">Business Analytics</h2>
          <div class="flex gap-3">
             <button onclick="clearConsoleCache()" class="bg-red-900/30 border border-red-500 text-red-400 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-600 hover:text-white">🗑 Clear Monthly Cache</button>
             <button onclick="window.print()" class="bg-primary/20 border border-primary text-primary px-4 py-2 rounded-xl text-xs font-bold">🖨 Print Report</button>
          </div>
        </div>

        <div id="printArea" class="space-y-6">
          <!-- Summary Cards -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="glass-card p-6 text-center border-t-2 border-emerald-500">
              <p class="text-[10px] font-bold text-slate-400 uppercase">Gross Revenue</p>
              <p id="dashGross" class="text-3xl font-black text-emerald-400 mt-2">₹0</p>
            </div>
            <div class="glass-card p-6 text-center border-t-2 border-blue-500">
              <p class="text-[10px] font-bold text-slate-400 uppercase">Cash Collected</p>
              <p id="dashCash" class="text-3xl font-black text-blue-400 mt-2">₹0</p>
            </div>
            <div class="glass-card p-6 text-center border-t-2 border-purple-500">
              <p class="text-[10px] font-bold text-slate-400 uppercase">Online / UPI</p>
              <p id="dashOnline" class="text-3xl font-black text-purple-400 mt-2">₹0</p>
            </div>
            <div class="glass-card p-6 text-center border-t-2 border-primary">
              <p class="text-[10px] font-bold text-slate-400 uppercase">Total Orders</p>
              <p id="dashCount" class="text-3xl font-black text-primary mt-2">0</p>
            </div>
          </div>

          <!-- Chart Area -->
          <div class="glass-card p-6 no-print">
             <h3 class="font-bold text-slate-400 text-sm mb-4">Revenue Trends (Chart)</h3>
             <canvas id="revenueChart" height="80"></canvas>
          </div>

          <!-- Transaction Logs -->
          <div class="glass-card p-6">
             <h3 class="font-bold text-slate-400 text-sm mb-4 border-b border-white/10 pb-2">Recent Transactions</h3>
             <table class="w-full text-left text-sm text-slate-300">
               <thead class="text-[10px] uppercase text-primary border-b border-white/10">
                 <tr><th class="py-2">Time</th><th class="py-2">Table</th><th class="py-2">Payment Breakdown</th><th class="py-2 text-right">Total</th></tr>
               </thead>
               <tbody id="dailyLogsTable"></tbody>
             </table>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- Edit Order Modal (Admin Full Control) -->
  <div id="editOrderModal" class="fixed inset-0 bg-black/80 z-[200] hidden flex items-center justify-center">
      <div class="glass-card w-full max-w-2xl p-6 relative">
          <button onclick="closeEditModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-black text-xl">✕</button>
          <h3 class="text-xl font-black text-primary mb-4">Edit Order - Table <span id="editTableId"></span></h3>
          <div id="editLineItems" class="space-y-2 max-h-64 overflow-y-auto mb-4 bg-dark/50 p-4 rounded-xl border border-white/10"></div>
          
          <div class="flex justify-between items-center border-t border-white/10 pt-4 mt-4">
              <button onclick="cancelFullOrder()" class="bg-red-600 text-white font-bold py-2 px-6 rounded hover:bg-red-700">Cancel Full Order</button>
              <button onclick="saveEditOrder()" class="bg-primary text-black font-bold py-2 px-6 rounded">Save Changes</button>
          </div>
      </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBKJxglt7aeg7uZ7jxNzX5aaIX0gJSIrQ", authDomain: "fusionmandi999-36066.firebaseapp.com", databaseURL: "https://fusionmandi999-36066-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "fusionmandi999-36066", storageBucket: "fusionmandi999-36066.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRole = null;
    let menuCache = {};
    let activeTables = {};
    let editTableRefId = null;
    let tempEditLineItems = {};

    window.attemptLogin = function() {
      const pin = document.getElementById('sysPin').value.trim();
      if (pin === 'admin123') currentRole = 'admin';
      else if (pin === 'kitchen123') currentRole = 'kitchen';
      else return alert("Invalid PIN");

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainLayout').classList.remove('hidden');
      document.getElementById('roleText').innerText = currentRole.toUpperCase();

      if(currentRole === 'admin') document.querySelectorAll('.admin-only').forEach(e => e.classList.remove('hidden'));
      loadSystemData();
      checkAutoDailyDownload();
    };

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(b => {
        if(b.id === `tab-${tab}`) b.classList.replace('text-slate-400', 'text-primary');
        else b.classList.replace('text-primary', 'text-slate-400');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
    };

    function loadSystemData() {
      // Menu load
      db.ref('menu').on('value', snap => {
        menuCache = snap.val() || {};
        if(currentRole === 'admin') renderInventory();
        checkStockAlerts();
      });

      // Active Tables load
      db.ref('active_tables').on('value', snap => {
        activeTables = snap.val() || {};
        renderFloorGrid();
      });

      // Daily Logs & Dash load
      const dStr = new Date().toISOString().split('T')[0];
      db.ref(`tallies/daily/${dStr}`).on('value', s => {
        const data = s.val() || { total: 0, cash: 0, upi: 0, orders: 0 };
        document.getElementById('dashGross').innerText = `₹${data.total}`;
        document.getElementById('dashCash').innerText = `₹${data.cash}`;
        document.getElementById('dashOnline').innerText = `₹${data.upi}`;
        document.getElementById('dashCount').innerText = `${data.orders}`;
        updateChart(data);
      });

      db.ref(`daily_logs/${dStr}`).on('value', s => {
        const tb = document.getElementById('dailyLogsTable'); tb.innerHTML = '';
        const logs = Object.values(s.val()||{});
        logs.forEach(log => {
          tb.innerHTML += `<tr class="border-b border-white/5"><td class="py-2">${log.time}</td><td class="py-2 font-bold text-primary">T-${log.table}</td><td class="py-2 text-[10px] text-slate-400">${log.method_desc || log.method}</td><td class="py-2 text-right text-emerald-400 font-bold">₹${log.total}</td></tr>`;
        });
      });
    }

    // --- Core Operations ---

    window.updateOrderStatus = function(id, status) {
       db.ref(`active_tables/${id}`).update({ status });
    };

    // Print Logic (Restricted if not accepted)
    window.printKOT = function(id) {
       const table = activeTables[id];
       if(table.status === 'pending') return alert("You must accept the order before printing.");
       let txt = `*** KOT - Table ${table.table} ***\n`;
       Object.values(table.line_items||{}).forEach(i => { if(!i.cancelled) txt += `${i.qty}x ${i.name}\n`; });
       // Logic to trigger receipt printer or open new window
       const win = window.open('', '_blank');
       win.document.write(`<pre style="font-size:20px; font-weight:bold;">${txt}</pre>`);
       win.print(); win.close();
    };

    window.clearAndBillTable = function(id) {
       const table = activeTables[id];
       const method = prompt("Payment Method? (CASH / UPI / SPLIT)", "CASH").toUpperCase();
       
       let methodDesc = method;
       let splitCash = 0, splitOnline = 0;
       
       if (method === 'SPLIT') {
           splitCash = parseFloat(prompt("Enter Cash Amount collected:")) || 0;
           splitOnline = table.total - splitCash;
           methodDesc = `SPLIT: Cash ₹${splitCash} / Online ₹${splitOnline}`;
       }

       const d = new Date().toISOString().split('T')[0];
       const timeStr = new Date().toLocaleTimeString();

       // Update Dashboard Tallies
       db.ref(`tallies/daily/${d}`).transaction(data => {
           let curr = data || { total: 0, cash: 0, upi: 0, orders: 0 };
           curr.total += table.total; curr.orders += 1;
           if(method === "CASH") curr.cash += table.total;
           else if(method === "UPI") curr.upi += table.total;
           else if(method === "SPLIT") { curr.cash += splitCash; curr.upi += splitOnline; }
           return curr;
       });

       // Log to Daily Logs
       db.ref(`daily_logs/${d}`).push({
           time: timeStr, table: table.table, method: method, method_desc: methodDesc, total: table.total
       });

       // Clear active table
       db.ref('active_tables/'+id).remove();
    };

    window.renderFloorGrid = function() {
      const grid = document.getElementById('kitchenGrid'); grid.innerHTML = '';
      Object.entries(activeTables).forEach(([id, table]) => {
          let border = 'border-white/10';
          if(table.status === 'pending') border = 'border-amber-500 animate-pulse';
          if(table.status === 'accepted') border = 'border-blue-500';
          
          let actionsHtml = '';
          if (currentRole === 'admin') {
              if (table.status === 'pending') {
                  actionsHtml += `<button onclick="updateOrderStatus('${id}', 'accepted')" class="bg-blue-600 px-3 py-1 rounded text-xs font-bold text-white w-full mb-2">Accept Order</button>`;
              }
              if (table.status !== 'pending') {
                  actionsHtml += `<button onclick="printKOT('${id}')" class="bg-slate-700 px-3 py-1 rounded text-xs font-bold text-white w-full mb-2">🖨 Print KOT</button>`;
                  actionsHtml += `<button onclick="updateOrderStatus('${id}', 'cooking')" class="bg-amber-600 px-3 py-1 rounded text-xs font-bold text-white w-1/2">Cooking</button>`;
                  actionsHtml += `<button onclick="updateOrderStatus('${id}', 'served')" class="bg-emerald-600 px-3 py-1 rounded text-xs font-bold text-white w-1/2 ml-1">Served</button>`;
              }
              actionsHtml += `<div class="mt-4 flex gap-2"><button onclick="openEditModal('${id}')" class="bg-white/10 border border-white/20 w-1/2 py-2 rounded text-xs">✏ Edit Order</button>
                              <button onclick="clearAndBillTable('${id}')" class="bg-primary text-black font-black w-1/2 py-2 rounded text-xs">🧾 Settle Bill</button></div>`;
          }

          let itemsHtml = '';
          Object.values(table.line_items||{}).forEach(li => {
             itemsHtml += li.cancelled ? `<s class="text-red-400 text-xs block">${li.qty}x ${li.name} (CANCELLED)</s>` : `<span class="block text-sm text-slate-300">${li.qty}x ${li.name}</span>`;
          });

          grid.innerHTML += `
            <div class="glass-card p-5 border-l-4 ${border}">
               <div class="flex justify-between items-center mb-3">
                  <span class="text-2xl font-black text-primary">T-${table.table}</span>
                  <span class="text-[10px] bg-white/10 px-2 py-1 rounded uppercase">${table.status.replace('_',' ')}</span>
               </div>
               <div class="mb-4 bg-dark/50 p-2 rounded max-h-32 overflow-y-auto">${itemsHtml}</div>
               <div class="font-black text-xl mb-4">Total: ₹${table.total}</div>
               <div>${actionsHtml}</div>
            </div>`;
      });
    };

    // --- Admin Full Editing & Cancelling ---

    window.openEditModal = function(id) {
        editTableRefId = id;
        tempEditLineItems = JSON.parse(JSON.stringify(activeTables[id].line_items || {}));
        document.getElementById('editTableId').innerText = activeTables[id].table;
        renderEditModalItems();
        document.getElementById('editOrderModal').classList.remove('hidden');
    };
    window.closeEditModal = function() { document.getElementById('editOrderModal').classList.add('hidden'); };

    function renderEditModalItems() {
        const div = document.getElementById('editLineItems'); div.innerHTML = '';
        Object.entries(tempEditLineItems).forEach(([key, li]) => {
            if(li.cancelled) return;
            div.innerHTML += `<div class="flex justify-between items-center py-2 border-b border-white/5">
                <span class="text-sm">${li.name} - ₹${li.price}</span>
                <div class="flex gap-2 items-center">
                   <button onclick="tempChangeQty('${key}',-1)" class="bg-white/10 px-2 rounded">-</button>
                   <span>${li.qty}</span>
                   <button onclick="tempChangeQty('${key}',1)" class="bg-white/10 px-2 rounded">+</button>
                   <button onclick="tempRemoveItem('${key}')" class="bg-red-600 text-xs px-2 py-1 rounded ml-2">Del</button>
                </div>
            </div>`;
        });
    }

    window.tempChangeQty = function(k, change) { tempEditLineItems[k].qty += change; if(tempEditLineItems[k].qty<=0) tempEditLineItems[k].cancelled=true; renderEditModalItems(); };
    window.tempRemoveItem = function(k) { tempEditLineItems[k].cancelled = true; renderEditModalItems(); };

    window.saveEditOrder = function() {
        let newSub = 0;
        Object.values(tempEditLineItems).forEach(i => { if(!i.cancelled) newSub += (i.price * i.qty); });
        db.ref(`active_tables/${editTableRefId}`).update({ line_items: tempEditLineItems, subtotal: newSub, total: newSub }).then(() => {
            closeEditModal(); alert('Order updated successfully.');
        });
    };

    window.cancelFullOrder = function() {
        if(!confirm('Are you sure you want to cancel the entire order? The customer bill will be zero.')) return;
        db.ref(`active_tables/${editTableRefId}`).update({ status: 'cancelled_full', total: 0 }).then(() => {
            closeEditModal();
        });
    };

    // --- Image Upload (Base64) & Inventory ---

    let uploadedBase64 = null;
    document.getElementById('newItemImageFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onloadend = () => { uploadedBase64 = reader.result; };
        reader.readAsDataURL(file);
    });

    window.addNewMenuItem = function() {
        const name = document.getElementById('newItemName').value.trim();
        const price = document.getElementById('newItemPrice').value;
        if(!name || !price) return alert("Fill Name and Price");
        
        const id = 'item_' + Date.now();
        db.ref(`menu/${id}`).set({
            name: name, base_price: Number(price), category: 'Added', stock_count: 50,
            image_url: uploadedBase64 || 'https://via.placeholder.com/300'
        }).then(() => {
            alert('Added successfully!');
            document.getElementById('newItemName').value = '';
            document.getElementById('newItemPrice').value = '';
            uploadedBase64 = null;
        });
    };

    window.renderInventory = function() {
        const list = document.getElementById('inventoryList'); list.innerHTML = '';
        Object.entries(menuCache).forEach(([id, item]) => {
            if(id === '_system_coupons') return;
            list.innerHTML += `<div class="glass-card p-4 flex gap-4 items-center">
                <img src="${item.image_url}" class="w-16 h-16 rounded object-cover border border-white/20">
                <div class="flex-1">
                   <h4 class="font-bold text-white text-sm">${item.name}</h4>
                   <p class="text-primary font-black text-xs">₹${item.base_price}</p>
                </div>
                <div class="text-right">
                   <span class="text-[10px] block text-slate-400">Stock</span>
                   <span class="font-black ${item.stock_count<=5?'text-red-500':'text-emerald-500'}">${item.stock_count||0}</span>
                </div>
            </div>`;
        });
    };

    // --- Alerts & Chart & Downloads ---

    function checkStockAlerts() {
        Object.values(menuCache).forEach(item => {
            if(item.stock_count === 5) alert(`⚠️ STOCK ALERT: ${item.name} only has 5 left!`);
            if(item.stock_count === 3) alert(`🚨 CRITICAL STOCK: ${item.name} only has 3 left!`);
        });
    }

    function checkAutoDailyDownload() {
        const todayStr = new Date().toISOString().split('T')[0];
        if (localStorage.getItem('lastExcelDownload') !== todayStr) {
            exportTodayExcel(todayStr);
            localStorage.setItem('lastExcelDownload', todayStr);
        }
    }

    window.exportTodayExcel = function(dateStr) {
        if(!dateStr) dateStr = new Date().toISOString().split('T')[0];
        db.ref(`daily_logs/${dateStr}`).once('value', snap => {
            const data = snap.val();
            if(!data) return;
            let csv = 'Time,Table,Payment Method,Total\n';
            Object.values(data).forEach(r => { csv += `${r.time},${r.table},${r.method},${r.total}\n`; });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
            a.download = `MandiCroods_Sales_${dateStr}.csv`;
            a.click();
        });
    };

    window.clearConsoleCache = function() {
        if(!confirm('Clear Firebase monthly cache data from local storage?')) return;
        localStorage.clear();
        alert('Cache cleared!');
    };

    let revenueChart = null;
    function updateChart(data) {
        const ctx = document.getElementById('revenueChart');
        if(!ctx) return;
        if(revenueChart) revenueChart.destroy();
        
        revenueChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Gross', 'Cash', 'Online'],
                datasets: [{
                    label: "Today's Revenue",
                    data: [data.total, data.cash, data.upi],
                    backgroundColor: ['#10b981', '#3b82f6', '#8b5cf6'],
                    borderRadius: 8
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } } } }
        });
    }

  </script>
</body>
</html>
