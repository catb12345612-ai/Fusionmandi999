<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Premium System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#D4AF37', dark: '#0a0a0a', sidebar: '#0F1014', light: '#f8f9fa', card: '#ffffff' } } } }
  </script>
</head>
<body class="font-sans antialiased bg-light text-slate-800">

  <!-- Login Modal -->
  <div id="loginScreen" class="fixed inset-0 bg-sidebar z-[100] flex flex-col items-center justify-center p-5">
    <div class="bg-[#141414] border border-primary/30 p-10 rounded-3xl text-center w-full max-w-sm">
      <h2 class="text-2xl font-black text-primary mb-6">System Login</h2>
      <input type="password" id="sysPin" placeholder="PIN (admin123)" onkeydown="if(event.key==='Enter') attemptLogin()" class="w-full text-center p-4 bg-white/10 text-white border border-white/20 rounded-xl mb-4 outline-none focus:border-primary">
      <button onclick="attemptLogin()" class="w-full bg-primary text-black font-black py-4 rounded-xl shadow-lg">ACCESS WORKSPACE</button>
    </div>
  </div>

  <div class="flex h-screen hidden" id="mainLayout">
    <aside class="w-64 bg-sidebar text-white flex flex-col shadow-xl z-20 p-4 space-y-2">
      <h1 class="font-black text-xl text-primary mb-6">Admin Panel</h1>
      <button onclick="switchTab('orders')" class="w-full text-left p-3 bg-primary/20 text-primary border border-primary/50 rounded-xl font-bold tab-btn" id="tab-orders">📦 Active Floor</button>
      <button onclick="switchTab('dashboard')" class="w-full text-left p-3 text-slate-400 hover:bg-white/5 rounded-xl font-bold tab-btn" id="tab-dashboard">📈 Analytics & Export</button>
      <div class="mt-auto">
        <button onclick="clearFirebaseCache()" class="w-full mb-3 bg-amber-500/10 text-amber-500 p-3 rounded-xl font-bold text-xs border border-amber-500/30">🧹 Optimize Database</button>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8" id="mainContent">
      
      <!-- Live Orders Section -->
      <section id="view-orders" class="tab-section">
        <h2 class="text-3xl font-black text-slate-900 mb-6">Floor Operations</h2>
        <div id="kitchenGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>

      <!-- Dashboard Section -->
      <section id="view-dashboard" class="tab-section hidden">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-3xl font-black text-slate-900">Dashboard & Revenue</h2>
          <div class="flex gap-3">
            <button onclick="exportToCSV()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-black text-sm shadow-md hover:bg-emerald-700">📊 Download Daily Excel (CSV)</button>
            <button onclick="window.print()" class="bg-white text-slate-800 border px-6 py-3 rounded-xl font-bold shadow-sm hover:bg-slate-50">🖨️ PDF Report</button>
          </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
          <div class="bg-dark text-primary p-6 rounded-2xl shadow-lg border border-primary/30"><p class="text-xs font-bold uppercase opacity-80">Total Gross</p><p id="tallyTotal" class="text-3xl font-black">₹0</p></div>
          <div class="bg-emerald-50 text-emerald-900 border border-emerald-200 p-6 rounded-2xl shadow-sm"><p class="text-xs font-bold uppercase">CASH Revenue</p><p id="tallyCash" class="text-3xl font-black">₹0</p></div>
        </div>

        <h3 class="text-lg font-black text-slate-900 mb-4">Completed Transactions</h3>
        <table class="w-full text-left text-sm border-collapse bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
          <thead class="bg-slate-100 text-slate-500 uppercase font-black text-[10px]">
            <tr><th class="p-4">Time</th><th class="p-4">Table</th><th class="p-4">Method</th><th class="p-4">Items</th><th class="p-4 text-right">Amount</th></tr>
          </thead>
          <tbody id="dailyLogsTable" class="divide-y divide-slate-100 font-medium text-slate-700"></tbody>
        </table>
      </section>

    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBKJxglt7aeg7uZ7jxNzX5aaIX0gJSIrQ", authDomain: "fusionmandi999-36066.firebaseapp.com", databaseURL: "https://fusionmandi999-36066-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "fusionmandi999-36066", storageBucket: "fusionmandi999-36066.firebasestorage.app", messagingSenderId: "312237706440", appId: "1:312237706440:web:f58610144c8e06a32ce9fd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT WEBAPP URL
    const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz-Ahs8nMIKF1H9JKCiekoUsMRvAdUWf2frZTmHlsNkah2Cysrym9Smk92j_wIn50dipQ/exec";

    let currentTables = {};

    window.attemptLogin = function() {
        const pin = document.getElementById('sysPin').value;
        if(pin === 'admin123') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainLayout').classList.remove('hidden');
        } else alert("Invalid PIN");
    };

    window.switchTab = function(tabId) {
        document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('bg-primary/20', 'text-primary', 'border-primary/50');
            b.classList.add('text-slate-400');
        });
        document.getElementById('view-' + tabId).classList.remove('hidden');
        document.getElementById('tab-' + tabId).classList.add('bg-primary/20', 'text-primary', 'border-primary/50');
        document.getElementById('tab-' + tabId).classList.remove('text-slate-400');
    };

    // ==========================================
    // 🟢 BUG FIX: GOOGLE SHEETS SYNC (100% BULLETPROOF)
    // ==========================================
    window.clearTable = function(id) {
        const tableData = currentTables[id];
        if(!tableData) return;
        if(!confirm(`Clear Table ${tableData.table} & Sync to Excel?`)) return;

        // 1. Strip emojis and special language characters that break JSON parsing
        const rawItems = tableData.items || "No items";
        const safeItemsText = rawItems.replace(/[^\x00-\x7F]/g, " ").trim(); 

        const d = new Date().toISOString().split('T')[0];
        const pMethod = tableData.paymentMethod || "CASH";

        // 2. Build the precise payload
        const sheetPayload = {
            orderId: id,
            date: d,
            table: tableData.table,
            items: safeItemsText, // FIXED SAFE STRING
            total: Number(tableData.total) || 0,
            method: pMethod.toUpperCase()
        };
        
        // 3. Send using text/plain to bypass strict CORS preflight blocking in Apps Script
        fetch(GOOGLE_SHEET_WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(sheetPayload)
        }).then(() => console.log('Google Sheets Sync Triggered successfully!'))
          .catch(e => console.error('Sheet Error:', e));

        // 4. Save to Firebase Dashboard
        db.ref(`daily_logs/${d}/${id}`).set({
            time: new Date().toLocaleTimeString(),
            table: tableData.table,
            items: safeItemsText,
            total: Number(tableData.total) || 0,
            method: pMethod.toUpperCase()
        });

        // 5. Remove from Floor
        db.ref('active_tables/'+id).remove();
    };

    // ==========================================
    // 🟢 PREMIUM FEATURE: EXCEL (CSV) EXPORT
    // ==========================================
    window.exportToCSV = function() {
        let csv = "Time,Table,Method,Items,Amount\n";
        const tb = document.getElementById('dailyLogsTable');
        if(!tb || tb.rows.length === 0) return alert("No transactions to export today.");
        
        for(let row of tb.rows) {
            let rowData = [];
            for(let cell of row.cells) {
                let text = cell.innerText.replace(/"/g, '""'); // Escape quotes
                rowData.push('"' + text + '"');
            }
            csv += rowData.join(",") + "\n";
        }
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Revenue_Report_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
    };

    // ==========================================
    // 🟢 PREMIUM FEATURE: FIREBASE CACHE CLEANUP
    // ==========================================
    window.clearFirebaseCache = function() {
        if(!confirm("⚠️ Database Optimization: This will delete transaction logs to free up Firebase storage space and prevent hitting limits. Continue?")) return;
        
        db.ref('daily_logs').remove().then(() => {
            alert("✅ Server cache optimized. Database space freed up!");
        }).catch(e => alert("Error: " + e.message));
    };

    // Floor Listener
    db.ref('active_tables').on('value', snap => {
        currentTables = snap.val() || {};
        const grid = document.getElementById('kitchenGrid'); grid.innerHTML = '';
        Object.entries(currentTables).forEach(([id, table]) => {
            grid.innerHTML += `
            <div class="bg-white p-5 rounded-2xl shadow border border-slate-200">
                <h3 class="font-black text-xl mb-2">Table ${table.table} <span class="text-xs bg-amber-100 text-amber-600 px-2 py-1 rounded ml-2 uppercase">${table.status}</span></h3>
                <p class="text-sm font-bold text-slate-600 mb-4">${table.items.replace(/ \| /g, '<br>')}</p>
                <div class="flex justify-between items-center border-t pt-3">
                    <span class="font-black text-xl text-emerald-600">₹${table.total}</span>
                    <button onclick="clearTable('${id}')" class="bg-dark text-primary px-4 py-2 rounded-xl text-xs font-black shadow-md">Clear & Save to Excel</button>
                </div>
            </div>`;
        });
    });

    // Dashboard Listener
    db.ref(`daily_logs/${new Date().toISOString().split('T')[0]}`).on('value', snap => {
        const tb = document.getElementById('dailyLogsTable'); tb.innerHTML = '';
        const logs = Object.values(snap.val()||{});
        let total = 0, cash = 0;
        logs.forEach(log => {
            if(!log) return;
            total += (log.total||0);
            if(log.method === 'CASH') cash += (log.total||0);
            tb.innerHTML += `<tr class="border-b"><td class="p-4">${log.time||''}</td><td class="p-4">T-${log.table||''}</td><td class="p-4"><span class="bg-slate-100 px-2 py-1 rounded font-bold text-[10px]">${log.method||''}</span></td><td class="p-4 text-xs font-semibold">${log.items||''}</td><td class="p-4 font-black text-right text-emerald-600">₹${log.total||0}</td></tr>`;
        });
        document.getElementById('tallyTotal').innerText = `₹${total}`;
        document.getElementById('tallyCash').innerText = `₹${cash}`;
    });

  </script>
</body>
</html>
