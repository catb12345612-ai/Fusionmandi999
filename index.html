<!-- index.html (Customer Interface) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Taj Darbar - Premium Dining</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .special-glow { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); border: 2px solid #f59e0b; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-36">

  <!-- Header & Language -->
  <div class="bg-slate-900 text-white px-5 py-2 flex justify-between items-center text-xs font-bold">
    <span data-i18n="welcome">Welcome to Taj Darbar</span>
    <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-800 text-amber-500 border border-slate-700 rounded px-2 py-1 outline-none">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="te">తెలుగు</option>
    </select>
  </div>

  <header class="glass sticky top-0 z-50 px-5 py-4 shadow-sm flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black tracking-tight text-slate-900">Taj Darbar</h1>
      <p class="text-xs font-bold text-amber-600 tracking-widest uppercase" data-i18n="smart_dine">Smart Dine-In</p>
    </div>
    <div class="bg-white px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 flex items-center space-x-2">
      <span class="text-xs font-black text-slate-400" data-i18n="table">TABLE</span>
      <select id="tableNum" class="bg-transparent font-black text-slate-900 outline-none cursor-pointer">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
      </select>
    </div>
  </header>

  <!-- Categories -->
  <div class="px-5 py-4 flex space-x-3 overflow-x-auto hide-scroll sticky top-[72px] z-40 bg-slate-50/95 backdrop-blur-md">
    <button onclick="filterMenu('All')" class="category-btn active px-6 py-2 rounded-full font-bold text-sm bg-slate-900 text-white shadow-md transition whitespace-nowrap" data-i18n="all_items">All Items</button>
    <button onclick="filterMenu('Mandi')" class="category-btn px-6 py-2 rounded-full font-bold text-sm bg-white text-slate-600 border shadow-sm transition whitespace-nowrap" data-i18n="mandi">Mandi</button>
    <button onclick="filterMenu('Shawarma')" class="category-btn px-6 py-2 rounded-full font-bold text-sm bg-white text-slate-600 border shadow-sm transition whitespace-nowrap" data-i18n="shawarma">Shawarma</button>
    <button onclick="filterMenu('Desserts')" class="category-btn px-6 py-2 rounded-full font-bold text-sm bg-white text-slate-600 border shadow-sm transition whitespace-nowrap" data-i18n="desserts">Desserts</button>
  </div>

  <!-- Active Order Tracker -->
  <div id="activeTracker" class="hidden mx-5 mb-4 bg-slate-900 text-white p-5 rounded-2xl shadow-xl border-l-4 border-amber-500 transition-all">
    <h3 class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1" data-i18n="live_status">Live Order Status</h3>
    <p id="orderStatusText" class="text-xl font-black text-amber-400 uppercase tracking-wide">Transmitting...</p>
    
    <div id="paymentSection" class="hidden mt-4 pt-4 border-t border-slate-700 text-center">
      <div id="feedbackBox" class="mb-5 pb-5 border-b border-slate-700">
        <p class="text-xs font-bold uppercase tracking-widest text-slate-300 mb-3" data-i18n="food_feedback">How is the food?</p>
        <div class="flex justify-center gap-6 text-3xl">
          <button onclick="sendFeedback('Bad')" class="hover:scale-125 transition-transform active:scale-95">😞</button>
          <button onclick="sendFeedback('Good')" class="hover:scale-125 transition-transform active:scale-95">😋</button>
          <button onclick="sendFeedback('Excellent')" class="hover:scale-125 transition-transform active:scale-95">😍</button>
        </div>
        <p id="feedbackThanks" class="text-xs font-bold text-emerald-400 mt-3 hidden" data-i18n="thanks_feedback">Thanks for your feedback! ❤️</p>
      </div>
      <p class="text-emerald-400 font-bold mb-3" data-i18n="scan_pay">Food Served! Scan to pay via PhonePe/GPay</p>
      <img id="upiQRCode" src="" class="mx-auto rounded-lg mb-3 w-40 h-40 bg-white p-2">
      <button onclick="downloadCustomerBill()" class="bg-slate-700 text-white px-4 py-2 rounded-lg font-bold text-sm w-full hover:bg-slate-600" data-i18n="download_bill">Download Offline Bill</button>
    </div>
  </div>

  <!-- Menu Grid -->
  <div id="menuGrid" class="px-5 grid grid-cols-1 md:grid-cols-2 gap-4 mt-2"></div>

  <!-- Cart -->
  <div id="cartFooter" class="hidden fixed bottom-6 left-5 right-5 md:left-auto md:right-5 md:w-96 glass rounded-2xl shadow-2xl border border-slate-200 p-4 z-50">
    <input type="text" id="orderNotes" data-placeholder="special_req" placeholder="Any special requests?" class="w-full mb-2 px-4 py-3 rounded-xl border border-slate-200 font-bold text-slate-800 outline-none focus:border-amber-500 bg-white placeholder-slate-400 text-sm shadow-inner">
    <input type="tel" id="custPhone" data-placeholder="whatsapp_no" placeholder="WhatsApp No. (For Receipt)" class="w-full mb-3 px-4 py-3 rounded-xl border border-slate-300 font-bold text-slate-800 outline-none focus:border-amber-500 bg-slate-50 placeholder-slate-400 text-center tracking-widest">
    
    <div class="flex justify-between items-center mb-3">
      <span class="font-bold text-slate-500 text-sm" data-i18n="total_bill">Total Bill</span>
      <span id="cartTotal" class="text-2xl font-black text-slate-900">₹0</span>
    </div>
    <button onclick="placeOrder()" id="placeOrderBtn" class="w-full bg-amber-600 text-white py-4 rounded-xl font-black text-lg shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
      <span data-i18n="confirm_order">Confirm & Send to Kitchen</span>
    </button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe"
    };

    const RESTAURANT_UPI_ID = "Q227869939@ybl"; 
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let menuData = {};
    let cart = {};
    let currentFilter = 'All';
    let myOrderId = localStorage.getItem('gani_cafe_order_id');
    let myOrderDetails = null;
    const fallbackImg = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80";

    // --- Translations ---
    const i18n = {
      en: {
        welcome: "Welcome to Taj Darbar", smart_dine: "Smart Dine-In", table: "TABLE",
        all_items: "All Items", mandi: "Mandi", shawarma: "Shawarma", desserts: "Desserts",
        live_status: "Live Order Status", food_feedback: "How is the food?", thanks_feedback: "Thanks for your feedback! ❤️",
        scan_pay: "Food Served! Scan to pay", download_bill: "Download Offline Bill",
        special_req: "Any special requests? (e.g. less spicy)", whatsapp_no: "WhatsApp No. (For Digital Receipt)",
        total_bill: "Total Bill", confirm_order: "Confirm & Send to Kitchen",
        sold_out: "SOLD OUT", out_of_stock_alert: "Sorry, limited stock available!", chefs_special: "⭐ CHEF'S SPECIAL"
      },
      hi: {
        welcome: "ताज दरबार में आपका स्वागत है", smart_dine: "स्मार्ट डाइन-इन", table: "टेबल",
        all_items: "सभी आइटम", mandi: "मंडी", shawarma: "शवर्मा", desserts: "मिठाइयाँ",
        live_status: "ऑर्डर की स्थिति", food_feedback: "खाना कैसा है?", thanks_feedback: "प्रतिक्रिया के लिए धन्यवाद! ❤️",
        scan_pay: "खाना परोसा गया! भुगतान के लिए स्कैन करें", download_bill: "ऑफ़लाइन बिल डाउनलोड करें",
        special_req: "कोई विशेष अनुरोध? (जैसे कम तीखा)", whatsapp_no: "व्हाट्सएप नंबर (रसीद के लिए)",
        total_bill: "कुल बिल", confirm_order: "पुष्टि करें और किचन भेजें",
        sold_out: "ख़त्म हो गया", out_of_stock_alert: "क्षमा करें, सीमित स्टॉक उपलब्ध है!", chefs_special: "⭐ शेफ की पसंद"
      },
      te: {
        welcome: "తాజ్ దర్బార్‌కు స్వాగతం", smart_dine: "స్మార్ట్ డైన్-ఇన్", table: "టేబుల్",
        all_items: "అన్ని అంశాలు", mandi: "మండి", shawarma: "షవర్మా", desserts: "డెజర్ట్స్",
        live_status: "లైవ్ ఆర్డర్ స్టేటస్", food_feedback: "ఆహారం ఎలా ఉంది?", thanks_feedback: "మీ ఫీడ్‌బ్యాక్‌కు ధన్యవాదాలు! ❤️",
        scan_pay: "ఆహారం అందించబడింది! చెల్లించడానికి స్కాన్ చేయండి", download_bill: "ఆఫ్‌లైన్ బిల్లును డౌన్‌లోడ్ చేయండి",
        special_req: "ఏదైనా ప్రత్యేక అభ్యర్థనలు?", whatsapp_no: "వాట్సాప్ నెం. (రసీదు కోసం)",
        total_bill: "మొత్తం బిల్లు", confirm_order: "నిర్ధారించి వంటగదికి పంపండి",
        sold_out: "అయిపోయింది", out_of_stock_alert: "క్షమించండి, స్టాక్ పరిమితంగా ఉంది!", chefs_special: "⭐ షెఫ్ స్పెషల్"
      }
    };
    let currentLang = 'en';
    const t = (key) => i18n[currentLang][key] || key;

    function changeLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-placeholder')); });
      renderMenu(); 
    }

    // Load Live Menu & Stock
    db.ref('menu').on('value', (snap) => {
      menuData = snap.val() || {};
      renderMenu();
    });

    function filterMenu(category) {
      currentFilter = category;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = btn.innerText.includes(category) || (category === 'All' && btn.innerText.includes('All'))
          ? "category-btn active px-6 py-2 rounded-full font-bold text-sm bg-slate-900 text-white shadow-md transition whitespace-nowrap"
          : "category-btn px-6 py-2 rounded-full font-bold text-sm bg-white text-slate-600 border shadow-sm transition whitespace-nowrap";
      });
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      grid.innerHTML = '';
      
      let sortedItems = Object.entries(menuData).sort((a, b) => {
        if (a[1].is_special && !b[1].is_special) return -1;
        if (!a[1].is_special && b[1].is_special) return 1;
        return 0;
      });

      sortedItems.forEach(([id, item]) => {
        if (currentFilter !== 'All' && item.category !== currentFilter) return;
        const stockCount = item.stock_count || 0;
        if (stockCount <= 0 && (cart[id] || 0) === 0) return; 

        const qty = cart[id] || 0;
        const isSpecial = item.is_special ? `<div class="absolute top-2 left-2 bg-amber-500 text-white text-[10px] font-black px-2 py-1 rounded shadow z-20">${t('chefs_special')}</div>` : '';
        const glowClass = item.is_special ? 'special-glow' : 'border-slate-100';
        
        grid.innerHTML += `
          <div class="bg-white rounded-2xl p-3 flex shadow-sm border ${glowClass} gap-4 relative overflow-hidden">
            ${stockCount <= 0 ? `<div class="absolute inset-0 bg-white/70 backdrop-blur-sm z-10 flex items-center justify-center"><span class="bg-red-500 text-white font-black px-3 py-1 rounded shadow-lg">${t('sold_out')}</span></div>` : ''}
            ${isSpecial}
            <div class="w-28 h-28 rounded-xl bg-slate-200 overflow-hidden flex-shrink-0 shadow-inner">
              <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='${fallbackImg}'">
            </div>
            <div class="flex flex-col justify-between py-1 flex-1 z-0">
              <div>
                <h3 class="font-bold text-slate-900 leading-tight">${item.name}</h3>
                <p class="text-[10px] font-black text-slate-400 mt-1 uppercase tracking-widest">${t(item.category.toLowerCase()) || item.category} | Qty: ${stockCount}</p>
              </div>
              <div class="flex justify-between items-center mt-2">
                <span class="font-black text-lg text-slate-900">₹${item.price}</span>
                <div class="flex items-center bg-slate-100 rounded-full p-1 shadow-inner border border-slate-200">
                  <button onclick="updateCart('${id}', -1)" class="w-8 h-8 rounded-full bg-white text-slate-800 font-black shadow-sm">-</button>
                  <span class="w-6 text-center font-bold text-sm">${qty}</span>
                  <button onclick="updateCart('${id}', 1)" class="w-8 h-8 rounded-full bg-amber-500 text-white font-black shadow-sm hover:bg-amber-600">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      updateCartUI();
    }

    function updateCart(id, change) {
      const currentQty = cart[id] || 0;
      const newQty = currentQty + change;
      if (newQty < 0) return;
      
      const stockAvailable = menuData[id].stock_count || 0;
      if (newQty > stockAvailable) {
        alert(t('out_of_stock_alert'));
        return;
      }
      
      cart[id] = newQty;
      if (cart[id] === 0) delete cart[id];
      renderMenu();
    }

    function updateCartUI() {
      const total = Object.entries(cart).reduce((sum, [id, q]) => sum + (menuData[id].price * q), 0);
      document.getElementById('cartTotal').innerText = '₹' + total;
      document.getElementById('cartFooter').classList.toggle('hidden', total === 0);
    }

    function placeOrder() {
      const btn = document.getElementById('placeOrderBtn');
      btn.disabled = true;

      const orderId = "ORD-" + Math.floor(1000 + Math.random() * 9000);
      let baseItems = Object.entries(cart).map(([id, q]) => `${menuData[id].name} (x${q})`).join(', ');
      let notes = document.getElementById('orderNotes').value.trim();
      let finalItems = notes ? `${baseItems}, 📝 NOTE: ${notes}` : baseItems;
      const total = Object.entries(cart).reduce((sum, [id, q]) => sum + (menuData[id].price * q), 0);
      let phone = document.getElementById('custPhone').value || "Not Provided";
      
      const payload = {
        orderId: orderId,
        table: document.getElementById('tableNum').value,
        phone: phone,
        items: finalItems,
        total: total,
        status: 'pending',
        timestamp: Date.now()
      };

      // Deduct Live Stock via transaction
      Object.entries(cart).forEach(([id, qty]) => {
        db.ref(`menu/${id}/stock_count`).transaction((currentStock) => {
          if (currentStock === null) return 0;
          return Math.max(0, currentStock - qty);
        });
      });

      db.ref('orders/' + orderId).set(payload).then(() => {
        cart = {};
        document.getElementById('custPhone').value = '';
        document.getElementById('orderNotes').value = '';
        renderMenu();
        localStorage.setItem('gani_cafe_order_id', orderId);
        myOrderId = orderId;
        listenToMyOrder();
        btn.disabled = false;
      });
    }

    function sendFeedback(rating) {
      if(!myOrderDetails) return;
      db.ref('feedback').push({ orderId: myOrderDetails.orderId, table: myOrderDetails.table, rating: rating, timestamp: Date.now() });
      document.getElementById('feedbackThanks').classList.remove('hidden');
    }

    function downloadCustomerBill() {
      if(!myOrderDetails) return;
      let cleanItems = myOrderDetails.items.replace(', 📝 NOTE:', '\nNOTE:');
      let bill = `=== TAJ DARBAR ===\nOrder: ${myOrderDetails.orderId}\nTable: ${myOrderDetails.table}\n------------------\n${cleanItems.split(', ').join('\n')}\n------------------\nTOTAL: Rs. ${myOrderDetails.total}\n=================`;
      const blob = new Blob([bill], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `TajDarbar_Bill_${myOrderDetails.orderId}.txt`;
      a.click();
    }

    function listenToMyOrder() {
      if (!myOrderId) return;
      db.ref('orders/' + myOrderId).on('value', snap => {
        const order = snap.val();
        const tracker = document.getElementById('activeTracker');
        const statusText = document.getElementById('orderStatusText');
        const paySection = document.getElementById('paymentSection');

        if (order) {
          myOrderDetails = order;
          tracker.classList.remove('hidden');
          
          if (order.status === 'pending') {
            tracker.className = "mx-5 mb-4 bg-slate-900 text-white p-5 rounded-2xl shadow-xl border-l-4 border-amber-500 transition-all";
            statusText.innerText = currentLang === 'en' ? "Sent to Kitchen" : (currentLang === 'hi' ? "किचन भेजा गया" : "వంటగదికి పంపబడింది");
            paySection.classList.add('hidden');
          } 
          else if (order.status === 'cooking') {
            tracker.className = "mx-5 mb-4 bg-slate-900 text-white p-5 rounded-2xl shadow-xl border-l-4 border-blue-500 transition-all";
            statusText.innerText = currentLang === 'en' ? "Chef is Cooking" : (currentLang === 'hi' ? "शेफ बना रहे हैं" : "చెఫ్ వండుతున్నాడు");
            paySection.classList.add('hidden');
          } 
          else if (order.status === 'served') {
            tracker.className = "mx-5 mb-4 bg-slate-900 text-white p-5 rounded-2xl shadow-xl border-l-4 border-emerald-500 transition-all";
            statusText.innerText = currentLang === 'en' ? "Food Served" : (currentLang === 'hi' ? "खाना परोसा गया" : "ఆహారం అందించబడింది");
            const upiString = `upi://pay?pa=${RESTAURANT_UPI_ID}&pn=TajDarbar&am=${order.total}`;
            document.getElementById('upiQRCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
            paySection.classList.remove('hidden');
            document.getElementById('feedbackThanks').classList.add('hidden'); 
          }
        } else {
          tracker.classList.add('hidden');
          localStorage.removeItem('gani_cafe_order_id');
          myOrderId = null;
          myOrderDetails = null;
          alert(t('thanks_feedback')); 
        }
      });
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('table') && params.get('table') <= 10) document.getElementById('tableNum').value = params.get('table');
    changeLanguage('en');
    listenToMyOrder();
  </script>
</body>
</html>
