<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mandi Croods - Premium Dining</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#D4AF37', secondary: '#B38B22', dark: '#0a0a0a', light: '#f9f9f9', card: '#ffffff' } } } }
  </script>
  <style>
    .hide-scroll::-webkit-scrollbar { display: none; }
    .food-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(212, 175, 55, 0.1); }
    .food-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.15); border-color: #D4AF37; }
    .glass-nav { background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(212,175,55,0.2); }
    .welcome-bg { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); }
    .gold-gradient { background: linear-gradient(135deg, #F9E596, #D4AF37, #AA8C2C); color: #0a0a0a; }
    .gold-text { background: linear-gradient(135deg, #D4AF37, #AA8C2C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .cart-pop-in { animation: slideUpBounce .55s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes slideUpBounce { 0% { transform: translateY(140%); opacity: 0; } 60% { transform: translateY(-8px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
    .fun-toast { position: fixed; left: 50%; top: 90px; transform: translateX(-50%); background: linear-gradient(135deg, #D4AF37, #B38B22); color: #0a0a0a; font-weight: 800; font-size: 13px; padding: 12px 24px; border-radius: 999px; box-shadow: 0 10px 30px rgba(212,175,55,0.4); z-index: 9998; animation: fadeInOut 3.5s forwards; }
    @keyframes fadeInOut { 0% { opacity: 0; transform: translate(-50%, -20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
  </style>
</head>
<body class="bg-light text-slate-800 font-sans antialiased pb-32 overflow-hidden">

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center p-5 welcome-bg">
    <div class="bg-dark p-8 rounded-3xl text-center w-full max-w-sm shadow-[0_10px_50px_rgba(212,175,55,0.15)] border border-primary/20">
      <div class="w-20 h-20 gold-gradient rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-lg border-2 border-dark">🍖</div>
      <h2 class="text-3xl font-black text-white mb-2 tracking-tight gold-text">Mandi Croods</h2>
      <p class="text-primary/70 text-sm font-semibold mb-6 tracking-wide">Enter mobile number to unlock our premium menu.</p>
      <input type="tel" id="customerMobile" inputmode="numeric" maxlength="10" placeholder="10-Digit Mobile" oninput="this.value = this.value.replace(/\D/g,'').slice(-10)" onkeydown="if(event.key==='Enter') registerCustomer()" class="w-full text-center p-4 bg-white/10 text-primary border border-primary/30 rounded-2xl font-black text-xl focus:border-primary outline-none mb-6 transition-all placeholder-primary/30">
      <button onclick="registerCustomer()" class="w-full gold-gradient font-black py-4 rounded-2xl shadow-[0_5px_20px_rgba(212,175,55,0.3)] active:scale-95 transition-transform uppercase tracking-widest text-sm">Enter Menu</button>
    </div>
  </div>

  <header class="glass-nav sticky top-0 z-40 px-5 py-4 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black tracking-tighter text-dark leading-none">Mandi <span class="text-primary">Croods</span></h1>
    </div>
    <div class="bg-dark text-primary px-3 py-1.5 rounded-xl shadow-md flex items-center gap-2 border border-primary/20">
      <span class="text-xs font-bold opacity-80">TABLE</span>
      <select id="tableNum" class="bg-transparent font-black text-primary outline-none cursor-pointer text-sm">
        <optgroup label="Standard Tables">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </optgroup>
      </select>
    </div>
  </header>

  <div class="px-5 py-4 flex space-x-3 overflow-x-auto hide-scroll sticky top-[68px] z-30 bg-light/95 backdrop-blur-md border-b border-primary/10 shadow-sm" id="categoryTabs">
    <!-- Categories injected here -->
  </div>

  <!-- Active Session / Tracker -->
  <div id="activeTracker" class="hidden mx-5 mt-4 bg-dark text-white p-6 rounded-3xl shadow-[0_10px_30px_rgba(212,175,55,0.2)] border border-primary/30 relative">
    <h3 class="text-xs text-primary font-black uppercase tracking-widest mb-1">Your Running Tab</h3>
    <p id="orderStatusText" class="text-2xl font-black text-white uppercase tracking-tight">Active Session</p>
    <div class="mt-4 border-t border-primary/20 pt-4">
      <div id="customerOrderedItems" class="hidden mb-4 p-4 bg-white/5 rounded-xl text-sm font-medium text-slate-300 max-h-48 overflow-y-auto shadow-inner border border-white/5"></div>
      <div class="flex justify-between items-center mb-4">
        <span class="text-slate-400 font-bold text-sm">Total Tab:</span>
        <span id="runningTotalDisplay" class="text-3xl font-black text-primary">₹0</span>
      </div>
      <button onclick="requestBill()" id="reqBillBtn" class="w-full gold-gradient py-3 rounded-xl font-black text-sm active:scale-95 transition-transform text-dark uppercase tracking-widest shadow-md">Request Final Bill</button>
    </div>
  </div>

  <div id="menuGrid" class="px-5 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-4 pb-20">
    <div class="text-center p-10 text-primary font-bold col-span-full">Loading Premium Menu...</div>
  </div>

  <!-- COLLAPSIBLE CART WITH UPSELL -->
  <div id="cartFooter" class="hidden fixed bottom-4 left-4 right-4 bg-dark border border-primary/40 rounded-3xl shadow-[0_10px_40px_rgba(212,175,55,0.2)] p-5 z-50 transition-all duration-300">
    <div class="flex items-center justify-between cursor-pointer select-none" onclick="toggleCart()">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 gold-gradient rounded-full flex items-center justify-center text-dark font-black relative shadow-md">🛒</div>
        <div>
          <p class="text-[10px] font-bold text-primary opacity-80 uppercase tracking-widest">Selected Items</p>
          <p id="cartTotal" class="text-2xl font-black text-white leading-none">₹0</p>
        </div>
      </div>
      <div id="cartToggleIcon" class="w-8 h-8 flex items-center justify-center bg-white/10 text-primary border border-primary/30 rounded-full font-black text-sm transition-transform duration-300">▼</div>
    </div>

    <div id="cartExpandedContent" class="overflow-hidden transition-all duration-300" style="max-height: 500px; opacity: 1; margin-top: 1rem;">
      <div id="cartListUI" class="mb-3 max-h-32 overflow-y-auto text-white"></div>
      
      <!-- Cross-selling Section -->
      <div class="mb-4 bg-white/5 p-3 rounded-xl border border-primary/20">
        <p class="text-[10px] font-black text-primary uppercase tracking-widest mb-2">🥤 Complete Your Meal</p>
        <div class="flex gap-3 overflow-x-auto hide-scroll pb-1" id="upsellItems">
           <!-- Dynamic Upsell Items inserted here -->
        </div>
      </div>

      <input type="text" id="orderNotes" placeholder="Chef instructions or special requests?" class="w-full mb-3 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white font-semibold outline-none focus:border-primary text-sm placeholder-slate-500">
      <button onclick="placeOrder()" id="placeOrderBtn" class="w-full gold-gradient text-dark py-4 rounded-xl font-black text-sm shadow-[0_5px_15px_rgba(212,175,55,0.3)] active:scale-95 transition-transform uppercase tracking-widest">Send to Kitchen</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBKJxglt7aeg7uZ7jxNzX5aaIX0gJSIrQ", authDomain: "fusionmandi999-36066.firebaseapp.com", databaseURL: "https://fusionmandi999-36066-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "fusionmandi999-36066", storageBucket: "fusionmandi999-36066.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let customerPhone = localStorage.getItem('mc_cust_phone') || "";
    let menuData = {};
    let cart = {}; 
    let currentFilter = 'All'; 
    let activeTableData = null;
    let cartExpanded = true;
    let autoBillText = "";
    let orderStartTs = null;

    // Waiter restrictions
    const RESTRICT_SERVICE = true;

    function showFunToast(text){
      const toast = document.createElement('div');
      toast.className = 'fun-toast';
      toast.innerText = text;
      document.body.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    function registerCustomer() {
      const num = document.getElementById('customerMobile').value.replace(/\D/g, '');
      if (num.length !== 10) return alert("Please enter a valid 10-digit mobile number.");
      customerPhone = num; localStorage.setItem('mc_cust_phone', num);
      document.getElementById('loginModal').style.display = 'none';
      document.body.classList.remove('overflow-hidden');
      showFunToast("Welcome to Mandi Croods! 👑");
      listenToRunningTab();
    }

    if (customerPhone && customerPhone.length >= 10) {
      document.getElementById('loginModal').style.display = 'none';
      document.body.classList.remove('overflow-hidden');
      listenToRunningTab();
    }

    // Load Menu from Firebase
    db.ref('menu').on('value', snap => {
      let rawData = snap.val() || {};
      menuData = {};
      Object.keys(rawData).forEach(k => {
        if (k !== '_system_coupons' && rawData[k] && typeof rawData[k] === 'object' && rawData[k].name) {
          menuData[k] = rawData[k];
        }
      });
      renderTabs();
      renderMenu();
      renderUpsell();
    });

    function renderTabs() {
        const tabs = ['All', 'Chicken', 'Mutton', 'Fish', 'Veg', 'Beverages'];
        const el = document.getElementById('categoryTabs');
        el.innerHTML = tabs.map(t => `<button onclick="filterMenu('${t}')" class="px-6 py-2.5 rounded-xl font-bold text-sm transition whitespace-nowrap border ${currentFilter===t ? 'bg-dark text-primary border-primary' : 'bg-white text-slate-600 border-slate-200'}">${t}</button>`).join('');
    }

    function filterMenu(cat) {
      currentFilter = cat;
      renderTabs();
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById('menuGrid'); grid.innerHTML = '';
      let items = Object.entries(menuData).filter(([id, item]) => {
          if (currentFilter === 'All') return true;
          return (item.category || '').toLowerCase().includes(currentFilter.toLowerCase());
      });

      if(items.length === 0) return grid.innerHTML = `<div class="col-span-full text-center text-primary p-5">No items found.</div>`;

      items.forEach(([id, item]) => {
        let stock = item.stock_count !== undefined ? Number(item.stock_count) : 50;
        let cartQty = cart[id] ? cart[id].qty : 0;
        
        grid.innerHTML += `
          <div class="food-card bg-card rounded-2xl p-4 flex flex-col relative overflow-hidden">
            ${stock <= 0 ? `<div class="absolute inset-0 bg-white/80 z-10 flex items-center justify-center"><span class="bg-dark text-primary font-black px-4 py-2 rounded-xl">SOLD OUT</span></div>` : ''}
            <img src="${item.image_url || 'https://via.placeholder.com/300?text=Premium+Dish'}" class="w-full h-32 object-cover rounded-xl mb-3 shadow-sm border border-slate-100">
            <h3 class="font-black text-dark text-sm leading-tight">${item.name}</h3>
            <span class="text-[10px] font-bold text-slate-400 mt-0.5 block">${item.category}</span>
            <div class="font-black text-lg text-primary mt-1">₹${item.base_price}</div>
            <div class="mt-auto pt-3 z-0">
               ${cartQty > 0
                 ? `<div class="flex items-center justify-between bg-slate-50 border border-primary/20 rounded-lg p-1">
                      <button onclick="updateCartQty('${id}', -1, ${stock})" class="w-8 h-8 bg-white rounded font-black">-</button>
                      <span class="font-black text-sm">${cartQty}</span>
                      <button onclick="updateCartQty('${id}', 1, ${stock})" class="w-8 h-8 bg-dark text-primary rounded font-black">+</button>
                    </div>`
                 : `<button onclick="updateCartQty('${id}', 1, ${stock})" class="w-full bg-dark text-primary border border-primary/40 font-black text-xs py-2.5 rounded-xl uppercase">+ ADD</button>`
               }
            </div>
          </div>`;
      });
    }

    function renderUpsell() {
        const container = document.getElementById('upsellItems');
        if(!container) return;
        const upsells = Object.entries(menuData).filter(([id, i]) => (i.category||'').toLowerCase().includes('bev') || i.name.toLowerCase().includes('ice cream'));
        container.innerHTML = upsells.map(([id, item]) => `
            <div class="min-w-[120px] bg-dark rounded-xl p-2 flex flex-col items-center border border-primary/30">
                <span class="text-xs font-bold text-white text-center truncate w-full">${item.name}</span>
                <span class="text-primary font-black text-xs my-1">₹${item.base_price}</span>
                <button onclick="updateCartQty('${id}', 1, ${item.stock_count||50})" class="bg-primary text-dark text-[10px] font-black px-3 py-1 rounded w-full">ADD</button>
            </div>
        `).join('');
    }

    window.updateCartQty = function(id, change, maxStock) {
      if(!menuData[id]) return;
      if (change > 0 && cart[id] && cart[id].qty >= maxStock) return alert("Out of stock limit reached!");
      if(change > 0) {
        if(cart[id]) cart[id].qty++; else cart[id] = { id, name: menuData[id].name, price: menuData[id].base_price, qty: 1 };
      } else {
        if(cart[id]) {
          cart[id].qty--;
          if(cart[id].qty <= 0) delete cart[id];
        }
      }
      renderMenu(); updateCartUI();
    };

    function updateCartUI() {
      let total = 0, totalQty = 0, uiHtml = '';
      Object.values(cart).forEach(i => {
        total += i.price * i.qty; totalQty += i.qty;
        uiHtml += `<div class="py-2 flex items-center justify-between border-b border-white/10 text-sm">
          <div><span class="font-bold text-white">${i.name}</span><br><span class="text-primary font-black text-xs">₹${i.price * i.qty}</span></div>
          <div class="flex items-center bg-white/10 rounded-lg p-1">
            <button onclick="updateCartQty('${i.id}', -1, 999)" class="w-6 h-6 bg-dark text-white rounded font-black">-</button>
            <span class="font-black w-6 text-center text-white text-xs">${i.qty}</span>
            <button onclick="updateCartQty('${i.id}', 1, 999)" class="w-6 h-6 bg-primary text-dark rounded font-black">+</button>
          </div>
        </div>`;
      });
      document.getElementById('cartTotal').innerText = '₹' + total;
      document.getElementById('cartListUI').innerHTML = uiHtml;
      const footer = document.getElementById('cartFooter');
      footer.classList.toggle('hidden', total <= 0);
      if(total > 0 && !cartExpanded) toggleCart();
    }

    window.toggleCart = function() {
      cartExpanded = !cartExpanded;
      const c = document.getElementById('cartExpandedContent');
      const i = document.getElementById('cartToggleIcon');
      if(cartExpanded) { c.style.maxHeight="500px"; c.style.opacity="1"; i.style.transform="rotate(0deg)"; } 
      else { c.style.maxHeight="0px"; c.style.opacity="0"; i.style.transform="rotate(180deg)"; }
    };

    window.placeOrder = function() {
      if(Object.keys(cart).length === 0) return;
      document.getElementById('placeOrderBtn').disabled = true;
      const chosenTable = document.getElementById('tableNum').value;
      const tableId = `table_${chosenTable}`;
      
      const batchId = `${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
      const newLineItems = {}; const stockUpdates = {};
      Object.values(cart).forEach((item, idx) => {
        newLineItems[`${batchId}_${idx}`] = { ...item, addedAt: Date.now(), cancelled: false };
        stockUpdates[item.id] = (stockUpdates[item.id]||0) + item.qty;
      });

      const existing = activeTableData || { table: chosenTable, phone: customerPhone, status: 'pending', line_items: {} };
      const mergedLineItems = { ...existing.line_items, ...newLineItems };
      const subTot = Object.values(mergedLineItems).reduce((acc, curr) => curr.cancelled ? acc : acc + (curr.price * curr.qty), 0);
      
      const payload = { ...existing, line_items: mergedLineItems, subtotal: subTot, total: subTot, status: existing.status==='accepted'?'accepted':'pending', timestamp: Date.now() };

      db.ref(`active_tables/${tableId}`).set(payload).then(() => {
        Object.keys(stockUpdates).forEach(id => db.ref(`menu/${id}/stock_count`).transaction(c => Math.max(0, (c||0) - stockUpdates[id])));
        cart = {}; document.getElementById('orderNotes').value = '';
        toggleCart(); renderMenu(); updateCartUI(); showFunToast("Order Sent to Kitchen!");
        document.getElementById('placeOrderBtn').disabled = false;
      }).catch(err => alert("Error: " + err.message));
    };

    // Customer CANCEL logic (2 minute window)
    window.cancelCustomerItem = function(tableId, lineItemKey) {
       if(!activeTableData || !activeTableData.line_items[lineItemKey]) return;
       const li = activeTableData.line_items[lineItemKey];
       const timePassed = Date.now() - li.addedAt;
       
       if (activeTableData.status !== 'pending' && activeTableData.status !== 'accepted') {
           return alert('Preparation has already started. Cannot cancel now.');
       }
       if (timePassed > 120000) { // 2 minutes
           return alert('Cancellation time (2 minutes) has expired for this item.');
       }
       
       if(!confirm(`Cancel ${li.name}?`)) return;
       
       const updatedLineItems = { ...activeTableData.line_items };
       updatedLineItems[lineItemKey].cancelled = true;
       const newSub = Object.values(updatedLineItems).reduce((acc, curr) => curr.cancelled ? acc : acc + (curr.price * curr.qty), 0);
       
       db.ref(`active_tables/${tableId}`).update({ line_items: updatedLineItems, subtotal: newSub, total: newSub }).then(() => {
           db.ref(`menu/${li.id}/stock_count`).transaction(c => (c||0) + li.qty);
           showFunToast("Item cancelled successfully!");
       });
    };

    function generateBillDownload(order) {
        let txt = `=== MANDI CROODS BILL ===\nTable: ${order.table}\nDate: ${new Date().toLocaleString()}\n---------------------\n`;
        Object.values(order.line_items || {}).forEach(i => {
            if(!i.cancelled) txt += `${i.qty}x ${i.name} - Rs.${i.price * i.qty}\n`;
        });
        txt += `---------------------\nTOTAL: Rs.${order.total}\nThank you for visiting!`;
        
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
        a.download = `MandiCroods_Bill_${order.table}_${Date.now()}.txt`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    let currentTableRef = null;
    function listenToRunningTab() {
      if(!customerPhone) return;
      const tableId = `table_${document.getElementById('tableNum').value}`;
      if(currentTableRef) currentTableRef.off();
      
      currentTableRef = db.ref(`active_tables/${tableId}`);
      currentTableRef.on('value', snap => {
        const order = snap.val();
        const tr = document.getElementById('activeTracker');
        const st = document.getElementById('orderStatusText');
        
        if(order && order.status === 'cancelled_full') {
            alert("Order fully cancelled by Admin. Bill is zero.");
            db.ref(`active_tables/${tableId}`).remove();
            return window.location.reload();
        }

        if (order && order.phone === customerPhone) {
          activeTableData = order;
          tr.classList.remove('hidden');
          document.getElementById('runningTotalDisplay').innerText = `₹${order.total}`;
          
          let itemsHtml = '';
          Object.entries(order.line_items || {}).forEach(([key, li]) => {
              if (li.cancelled) {
                  itemsHtml += `<div class="py-2 border-b border-white/5 opacity-50"><span class="text-red-500">✕</span> <s>${li.name} (x${li.qty})</s> - CANCELLED</div>`;
              } else {
                  const timePassed = Date.now() - li.addedAt;
                  const canCancel = (order.status === 'pending' || order.status === 'accepted') && timePassed <= 120000;
                  itemsHtml += `<div class="py-2 border-b border-white/5 flex justify-between">
                     <span><span class="text-primary">✓</span> ${li.name} (x${li.qty}) - ₹${li.price * li.qty}</span>
                     ${canCancel ? `<button onclick="cancelCustomerItem('${tableId}','${key}')" class="text-[10px] bg-red-600 px-2 py-1 rounded">Cancel</button>` : ''}
                  </div>`;
              }
          });
          document.getElementById('customerOrderedItems').innerHTML = itemsHtml;
          document.getElementById('customerOrderedItems').classList.remove('hidden');

          // Admin Accept Logic reflected here
          if (order.status === 'pending') { st.innerText = "Order Sent to Kitchen"; st.className = "text-xl font-black text-amber-400"; }
          else if (order.status === 'accepted') { st.innerText = "Order Accepted by Admin"; st.className = "text-xl font-black text-blue-400"; }
          else if (order.status === 'cooking') { st.innerText = "Chef is Cooking..."; st.className = "text-xl font-black text-orange-400"; }
          else if (order.status === 'served') { st.innerText = "Food Served! Enjoy."; st.className = "text-xl font-black text-emerald-400"; }
        } else {
          if (activeTableData) { // Table cleared
            generateBillDownload(activeTableData);
            alert("Table Cleared! Receipt downloaded automatically.");
            window.location.reload();
          }
        }
      });
    }

    document.getElementById('tableNum').addEventListener('change', listenToRunningTab);
  </script>
</body>
</html>
