<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fusion Mandi - Premium Digital Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#ff7529', dark: '#1e1e2d', light: '#f4f5f8', card: '#ffffff' } } } }
  </script>
  <style>
    .hide-scroll::-webkit-scrollbar { display: none; }
    .glass-nav { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    .welcome-bg { background: linear-gradient(rgba(30,30,45,0.85), rgba(30,30,45,0.95)), url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=1000&q=80') center/cover no-repeat fixed; }
  </style>
</head>
<body class="bg-light text-slate-800 font-sans antialiased pb-32">

  <!-- Welcome / Login Modal -->
  <div id="loginModal" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-5 welcome-bg">
    <div class="bg-white p-8 rounded-3xl text-center w-full max-w-sm shadow-2xl">
      <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">🍖</div>
      <h2 class="text-3xl font-black text-dark mb-2 tracking-tight">Fusion Mandi<br><span class="text-primary text-xl">Welcomes You</span></h2>
      <p class="text-slate-500 text-sm font-semibold mb-6">Enter your mobile number to start your tab & receive your receipt.</p>
      <input type="tel" id="customerMobile" placeholder="10-Digit Mobile" class="w-full text-center p-4 bg-light border border-slate-200 rounded-2xl font-black text-xl focus:border-primary outline-none mb-4">
      <button onclick="registerCustomer()" class="w-full bg-primary text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">START DINING</button>
    </div>
  </div>

  <div class="bg-dark text-white px-5 py-2 flex justify-between items-center text-[10px] font-bold">
    <span class="text-cyan-400">Dev: Syed Zeeshaan Ali | High-Fledged</span>
    <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-800 text-amber-500 border border-slate-700 rounded px-2 py-1 outline-none">
      <option value="en">ENG</option><option value="hi">हिंदी</option><option value="te">తెలుగు</option>
    </select>
  </div>

  <!-- Header -->
  <header class="glass-nav sticky top-0 z-50 px-5 py-4 shadow-sm flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-black tracking-tighter text-dark leading-none">Fusion <span class="text-primary">Mandi</span></h1>
    </div>
    <div class="bg-dark text-white px-3 py-1.5 rounded-xl shadow-md flex items-center gap-2">
      <span class="text-xs font-bold text-slate-300">TABLE</span>
      <select id="tableNum" class="bg-transparent font-black text-white outline-none cursor-pointer text-sm">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
      </select>
    </div>
  </header>

  <!-- Categories -->
  <div class="px-5 py-4 flex space-x-3 overflow-x-auto hide-scroll sticky top-[68px] z-40 bg-light/95 backdrop-blur-md border-b border-slate-200">
    <button onclick="filterMenu('All')" class="category-btn active px-6 py-2.5 rounded-xl font-bold text-sm bg-primary text-white shadow-md whitespace-nowrap">All Menu</button>
    <button onclick="filterMenu('Chicken Mandi')" class="category-btn px-6 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 whitespace-nowrap">Chicken</button>
    <button onclick="filterMenu('Mutton Mandi')" class="category-btn px-6 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 whitespace-nowrap">Mutton</button>
    <button onclick="filterMenu('Veg Mandi')" class="category-btn px-6 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 whitespace-nowrap">Veg</button>
    <button onclick="filterMenu('Beverages')" class="category-btn px-6 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 whitespace-nowrap">Drinks</button>
  </div>

  <!-- Active Running Tab -->
  <div id="activeTracker" class="hidden mx-5 mt-4 bg-dark text-white p-6 rounded-3xl shadow-xl border-l-4 border-amber-500 relative overflow-hidden">
    <h3 class="text-xs text-primary font-black uppercase tracking-widest mb-1">Your Running Tab</h3>
    <p id="orderStatusText" class="text-2xl font-black text-white uppercase">Active Session</p>
    
    <div class="mt-4 border-t border-slate-700 pt-4">
      <div class="flex justify-between items-center mb-4">
        <span class="text-slate-400 font-bold text-sm">Total Tab:</span>
        <span id="runningTotalDisplay" class="text-3xl font-black text-emerald-400">₹0</span>
      </div>
      <button onclick="requestBill()" id="reqBillBtn" class="w-full bg-primary text-white py-3 rounded-xl font-black text-sm active:scale-95 transition-transform">Request Final Bill</button>
    </div>

    <div id="paymentSection" class="hidden mt-5 pt-5 border-t border-slate-700 text-center">
      <div class="mb-5 pb-5 border-b border-slate-700">
        <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4">Rate your food</p>
        <div class="flex justify-center gap-6 text-4xl">
          <button onclick="sendFeedback('Bad')">😞</button>
          <button onclick="sendFeedback('Good')">😋</button>
          <button onclick="sendFeedback('Excellent')">😍</button>
        </div>
      </div>
      <p class="text-primary font-black mb-4 text-sm uppercase">Scan to Pay via UPI</p>
      <img id="upiQRCode" src="" class="mx-auto rounded-2xl mb-4 w-44 h-44 bg-white p-3 shadow-lg">
    </div>
  </div>

  <!-- Menu Grid -->
  <div id="menuGrid" class="px-5 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-4"></div>

  <!-- Cart Footer -->
  <div id="cartFooter" class="hidden fixed bottom-4 left-4 right-4 md:left-auto md:right-5 md:w-[400px] bg-white rounded-3xl shadow-2xl border border-slate-100 p-5 z-50">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary font-black">🛒</div>
      <div>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">New Items</p>
        <p id="cartTotal" class="text-2xl font-black text-dark leading-none">₹0</p>
      </div>
    </div>
    <div id="cartListUI" class="mb-3 max-h-32 overflow-y-auto text-sm font-bold text-slate-700 divide-y divide-slate-100"></div>
    <button onclick="placeOrder()" id="placeOrderBtn" class="w-full bg-primary text-white py-4 rounded-xl font-black text-lg active:scale-95 transition-transform">
      Send to Kitchen
    </button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBKJxglt7aeg7uZ7jxNzX5aaIX0gJSIrQ", authDomain: "fusionmandi999-36066.firebaseapp.com", databaseURL: "https://fusionmandi999-36066-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "fusionmandi999-36066", storageBucket: "fusionmandi999-36066.firebasestorage.app", messagingSenderId: "312237706440", appId: "1:312237706440:web:f58610144c8e06a32ce9fd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let menuData = {}; let cart = {}; let currentFilter = 'All'; let activeTableData = null;
    let customerPhone = localStorage.getItem('fm_cust_phone') || "";
    if (customerPhone) document.getElementById('loginModal').style.display = 'none';

    window.registerCustomer = function() {
      const num = document.getElementById('customerMobile').value;
      if (num.length < 10) return alert("Please enter valid mobile number.");
      customerPhone = num; localStorage.setItem('fm_cust_phone', num);
      document.getElementById('loginModal').style.display = 'none';
      listenToRunningTab();
    };

    window.filterMenu = function(cat) {
      currentFilter = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = btn.innerText.includes(cat.split(' ')[0]) || (cat==='All' && btn.innerText.includes('All'))
          ? "category-btn active px-6 py-2.5 rounded-xl font-bold text-sm bg-primary text-white shadow-md whitespace-nowrap"
          : "category-btn px-6 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 whitespace-nowrap";
      });
      renderMenu();
    };

    db.ref('menu').on('value', snap => { menuData = snap.val() || {}; renderMenu(); });

    function renderMenu() {
      const grid = document.getElementById('menuGrid'); grid.innerHTML = '';
      let items = Object.entries(menuData).sort((a,b) => (b[1].is_special?1:0) - (a[1].is_special?1:0));

      items.forEach(([id, item]) => {
        if (currentFilter !== 'All' && !item.category.includes(currentFilter.split(' ')[0])) return;
        const stock = item.stock_count || 0;
        
        let selectHtml = item.variants 
          ? `<select id="var-${id}" class="w-full mt-2 p-2 rounded-lg text-xs font-bold bg-light border-none outline-none">
              ${Object.values(item.variants).map(v => `<option value="${v.name}\vert{}${v.price}">${v.name} - ₹${v.price}</option>`).join('')}
             </select>` 
          : `<div class="font-black text-xl text-primary mt-1">₹${item.base_price}</div>`;

        let cartQty = 0; Object.keys(cart).forEach(k => { if(k.startsWith(id+"|")) cartQty += cart[k].qty; });

        grid.innerHTML += `
          <div class="food-card bg-card rounded-2xl p-4 flex flex-col relative overflow-hidden border ${item.is_special?'border-amber-400 shadow-md':'border-slate-100'}">
            ${stock <= 0 ? `<div class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex items-center justify-center"><span class="bg-dark text-white font-black px-4 py-2 rounded-xl shadow-lg">SOLD OUT</span></div>` : ''}
            ${item.is_special ? `<div class="absolute top-3 left-3 bg-amber-500 text-white text-[10px] font-black px-2 py-1 rounded-md shadow-md z-20">⭐ 5 Stars Special</div>` : ''}
            <div class="w-full h-32 rounded-xl bg-light overflow-hidden shadow-inner mb-3">
              <img src="${item.image_url}" class="w-full h-full object-cover">
            </div>
            <div class="flex flex-col flex-1">
              <h3 class="font-black text-dark leading-tight text-sm">${item.name}</h3>
              ${selectHtml}
              <div class="flex items-center justify-between mt-auto pt-3 z-0">
                 ${cartQty > 0 
                  ? `<div class="flex items-center bg-slate-100 rounded-lg p-1 w-full justify-between">
                       <button onclick="updateCartQty('${id}', -1)" class="w-8 h-8 bg-white rounded-md font-black shadow-sm text-slate-800">-</button>
                       <span class="font-black text-sm">${cartQty}</span>
                       <button onclick="updateCartQty('${id}', 1,${stock})" class="w-8 h-8 bg-primary rounded-md font-black shadow-sm text-white">+</button>
                     </div>`
                  : `<button onclick="updateCartQty('${id}', 1,${stock})" class="w-full bg-dark text-white font-black text-xs py-2.5 rounded-xl active:scale-95 transition-transform">+ ADD</button>`
                 }
              </div>
            </div>
          </div>`;
      });
      updateCartUI();
    }

    window.updateCartQty = function(id, change, maxStock) {
      let finalPrice = menuData[id].base_price, varName = "Regular"; 
      const sel = document.getElementById(`var-${id}`);
      if (sel) { const pts = sel.value.split('|'); varName = pts[0]; finalPrice = parseInt(pts[1]); }
      
      const cartKey = `${id}|${varName}`;
      let totalQtyOfThisItem = 0; Object.keys(cart).forEach(k => { if(k.startsWith(id+"|")) totalQtyOfThisItem += cart[k].qty; });

      if (change > 0 && totalQtyOfThisItem >= maxStock) return alert("Out of stock!");
      
      if(change > 0) {
        if(cart[cartKey]) cart[cartKey].qty++; else cart[cartKey] = { id, name: menuData[id].name, variant: varName, price: finalPrice, qty: 1 };
      } else {
        if(cart[cartKey]) { cart[cartKey].qty--; if(cart[cartKey].qty <= 0) delete cart[cartKey]; }
      }
      renderMenu();
    };

    function updateCartUI() {
      let total = 0; let uiHtml = '';
      Object.values(cart).forEach(i => {
        total += (i.price * i.qty);
        uiHtml += `<div class="py-2 flex justify-between"><span>${i.qty}x ${i.name} <small class="text-slate-400">(${i.variant})</small></span><span>₹${i.price * i.qty}</span></div>`;
      });
      document.getElementById('cartTotal').innerText = '₹' + total;
      document.getElementById('cartListUI').innerHTML = uiHtml;
      document.getElementById('cartFooter').classList.toggle('hidden', total === 0);
    }

    window.placeOrder = function() {
      document.getElementById('placeOrderBtn').disabled = true;
      const tableId = `table_${document.getElementById('tableNum').value}`;
      
      let newItemsString = Object.values(cart).map(i => `${i.name} [${i.variant}] (x${i.qty})`).join(', ');
      let newTotal = 0; let stockUpdates = {};
      Object.values(cart).forEach(item => { newTotal += (item.price * item.qty); if(!stockUpdates[item.id]) stockUpdates[item.id] = 0; stockUpdates[item.id] += item.qty; });

      Object.keys(stockUpdates).forEach(itemId => {
        db.ref(`menu/${itemId}/stock_count`).transaction(curr => Math.max(0, (curr||0) - stockUpdates[itemId]));
      });

      db.ref(`active_tables/${tableId}`).once('value', snap => {
        let existing = snap.val() || { total: 0, items: "", status: "pending" };
        let updatedItems = existing.items ? existing.items + " | " + newItemsString : newItemsString;
        
        db.ref(`active_tables/${tableId}`).set({ 
          orderId: tableId, table: document.getElementById('tableNum').value, 
          phone: customerPhone, items: updatedItems, total: existing.total + newTotal, 
          status: 'pending', timestamp: Date.now() 
        }).then(() => {
          cart = {}; document.getElementById('placeOrderBtn').disabled = false; renderMenu(); listenToRunningTab();
        });
      });
    };

    window.requestBill = function() {
      const tableId = `table_${document.getElementById('tableNum').value}`;
      const method = prompt("How would you like to pay? Type 'CASH', 'UPI', or 'COUNTER'");
      if(method) db.ref(`active_tables/${tableId}`).update({ status: 'bill_requested', paymentMethod: method.toUpperCase() });
    };

    window.sendFeedback = function(rating) {
      if(!activeTableData) return;
      db.ref('feedback').push({ table: activeTableData.table, rating: rating, timestamp: Date.now() });
      document.getElementById('feedbackBox').innerHTML = `<p class="text-emerald-400 font-bold">Feedback saved! ❤️</p>`;
    };

    let autoBillText = "";
    function listenToRunningTab() {
      if(!customerPhone) return;
      const tableId = `table_${document.getElementById('tableNum').value}`;
      db.ref(`active_tables/${tableId}`).on('value', snap => {
        const order = snap.val(); 
        const tr = document.getElementById('activeTracker'); const st = document.getElementById('orderStatusText'); 
        const ps = document.getElementById('paymentSection'); const reqBtn = document.getElementById('reqBillBtn');

        if (order) {
          activeTableData = order; tr.classList.remove('hidden'); 
          document.getElementById('runningTotalDisplay').innerText = `₹${order.total}`;
          autoBillText = `=== FUSION MANDI ===\nTable: ${order.table}\nMobile: ${order.phone}\n------------------\n${order.items.replace(/ \| /g,'\n')}\n------------------\nTOTAL: Rs. ${order.total}\n=================`;

          if (order.status === 'pending' || order.status === 'cooking') { 
            st.innerText = "Order In Progress"; ps.classList.add('hidden'); reqBtn.classList.remove('hidden'); reqBtn.innerText = "Request Final Bill";
          } else if (order.status === 'bill_requested') { 
            st.innerText = "Bill Requested"; ps.classList.add('hidden'); reqBtn.classList.remove('hidden'); reqBtn.innerText = "Waiting for Admin...";
          } else if (order.status === 'bill_ready') { 
            st.innerText = "Please Pay Bill"; 
            document.getElementById('upiQRCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(`upi://pay?pa=Q227869939@ybl&pn=FusionMandi&am=${order.total}`)}`; 
            ps.classList.remove('hidden'); reqBtn.classList.add('hidden');
          }
        } else { 
          if(activeTableData) {
            tr.classList.add('hidden'); activeTableData = null;
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([autoBillText], { type: 'text/plain' })); a.download = `FusionMandi_Bill_${tableId}.txt`; a.click();
            setTimeout(() => { window.open(`https://wa.me/91${customerPhone}?text=${encodeURIComponent(autoBillText)}`, '_blank'); }, 500);
            alert("Table Cleared! Receipt downloaded and opened in WhatsApp.");
          }
        }
      });
    }

    document.getElementById('tableNum').addEventListener('change', () => { listenToRunningTab(); });
    listenToRunningTab();
  </script>
</body>
</html>
