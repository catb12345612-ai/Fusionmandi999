<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Premium Dining</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#D4AF37', secondary: '#B38B22', dark: '#0a0a0a', light: '#f9f9f9', card: '#ffffff' } } } }
  </script>
  <style>
    html { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .food-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(212, 175, 55, 0.1); }
    .food-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.15); border-color: #D4AF37; }
    .glass-nav { background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(212,175,55,0.2); }
    .welcome-bg { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); }
    .gold-gradient { background: linear-gradient(135deg, #F9E596, #D4AF37, #AA8C2C); color: #0a0a0a; }
    .gold-text { background: linear-gradient(135deg, #D4AF37, #AA8C2C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    @keyframes slideUpBounce { 0% { transform: translateY(140%); opacity: 0; } 60% { transform: translateY(-8px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
    .cart-pop-in { animation: slideUpBounce .55s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes fadeInCard { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .fade-in-card { animation: fadeInCard .4s ease both; }
    #sideServiceDock { transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    #sideServiceDock.dock-closed { transform: translateX(calc(100% - 38px)); }
    #sideServiceDock.dock-open { transform: translateX(0); }
  </style>
</head>
<body class="bg-light text-slate-800 font-sans antialiased pb-36 overflow-x-hidden">

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center p-5 welcome-bg">
    <div class="bg-dark p-8 rounded-3xl text-center w-full max-w-sm shadow-[0_10px_50px_rgba(212,175,55,0.15)] border border-primary/20 relative z-10">
      <div class="w-20 h-20 gold-gradient rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-lg border-2 border-dark">🍖</div>
      <h2 class="text-3xl font-black text-white mb-2 tracking-tight gold-text">Welcome</h2>
      <p class="text-primary/70 text-sm font-semibold mb-6 tracking-wide">Enter mobile number to unlock menu.</p>
      <input type="tel" id="customerMobile" maxlength="10" placeholder="10-Digit Mobile" oninput="this.value = this.value.replace(/\D/g,'').slice(-10)" class="w-full text-center p-4 bg-white/10 text-primary border border-primary/30 rounded-2xl font-black text-xl focus:border-primary outline-none mb-6 transition-all placeholder-primary/30">
      <button onclick="registerCustomer()" class="w-full gold-gradient font-black py-4 rounded-2xl shadow-[0_5px_20px_rgba(212,175,55,0.3)] active:scale-95 transition-transform uppercase tracking-widest text-sm">Enter Menu</button>
    </div>
  </div>

  <header class="glass-nav sticky top-0 z-40 px-5 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-black tracking-tighter text-dark leading-none">Smart <span class="text-primary">Menu</span></h1>
    <div class="bg-dark text-primary px-3 py-1.5 rounded-xl shadow-md flex items-center gap-2 border border-primary/20">
      <span class="text-xs font-bold opacity-80">TABLE</span>
      <select id="tableNum" class="bg-transparent font-black text-primary outline-none cursor-pointer text-sm">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
      </select>
    </div>
  </header>

  <!-- Promo Banner for MC Coupon -->
  <div class="mx-5 mt-3 bg-dark text-white px-4 py-2.5 rounded-2xl border border-primary/40 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <span class="text-lg">🎟️</span>
      <div>
        <p class="text-[11px] font-black text-primary uppercase tracking-wider">Use Code: <span class="bg-primary text-dark px-1.5 py-0.5 rounded font-black">MC</span></p>
        <p class="text-[10px] text-slate-300 font-semibold">₹100-500: ₹50 OFF • ₹899+: ₹100 OFF</p>
      </div>
    </div>
    <button onclick="quickApplyMCCoupon()" class="text-[10px] font-black text-dark bg-primary px-2 py-1 rounded-lg">Apply</button>
  </div>

  <!-- Category Bar -->
  <div class="px-5 py-4 flex space-x-3 overflow-x-auto hide-scroll sticky top-[68px] z-30 bg-light/95 backdrop-blur-md border-b border-primary/10">
    <button onclick="filterMenu('All', this)" data-cat="All" class="category-btn active px-6 py-2.5 rounded-xl font-bold text-sm bg-dark text-primary shadow-md whitespace-nowrap border border-primary/30">Premium Menu</button>
    <button onclick="filterMenu('Group', this)" data-cat="Group" class="category-btn px-6 py-2.5 rounded-xl font-black text-sm bg-primary/10 text-secondary border border-primary/30 hover:bg-primary/20 whitespace-nowrap">👑 Royal Packs (4+)</button>
    <button onclick="filterMenu('Chicken', this)" data-cat="Chicken" class="category-btn px-6 py-2.5 rounded-xl font-bold text-sm bg-white border border-slate-200 hover:border-primary whitespace-nowrap">Chicken</button>
    <button onclick="filterMenu('Mutton', this)" data-cat="Mutton" class="category-btn px-6 py-2.5 rounded-xl font-bold text-sm bg-white border border-slate-200 hover:border-primary whitespace-nowrap">Mutton</button>
  </div>

  <div id="menuGrid" class="px-5 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-4"></div>

  <!-- SLIDING SIDE SERVICE DOCK -->
  <div id="sideServiceDock" class="fixed right-0 top-1/2 -translate-y-1/2 z-40 flex items-center dock-closed">
    <button onclick="toggleSideDock()" class="bg-dark text-primary border-y-2 border-l-2 border-primary/60 rounded-l-2xl py-4 px-2.5 shadow-[0_5px_25px_rgba(0,0,0,0.4)] flex flex-col items-center gap-1">
      <span id="sideDockArrow" class="text-xs font-black">◀</span>
      <span class="text-base">🛎️</span>
    </button>
    <div class="bg-dark/95 backdrop-blur-md border-y-2 border-l border-primary/40 p-3 rounded-bl-2xl shadow-2xl flex flex-col gap-3">
      <button onclick="requestStaff('Water Refill')" class="bg-primary/20 hover:bg-primary/30 text-primary px-3 py-2 rounded-xl text-xs font-black">💧 Water</button>
      <button onclick="requestStaff('Clean Table')" class="bg-primary/20 hover:bg-primary/30 text-primary px-3 py-2 rounded-xl text-xs font-black">🧽 Clean</button>
      <button onclick="requestStaff('Call Waiter')" class="gold-gradient text-dark px-3 py-2 rounded-xl text-xs font-black">👤 Staff</button>
    </div>
  </div>

  <!-- COLLAPSIBLE CART -->
  <div id="cartFooter" class="hidden fixed bottom-0 left-0 w-full bg-dark border-t border-primary/40 shadow-[0_-10px_40px_rgba(212,175,55,0.3)] p-5 z-50 rounded-t-3xl transition-all">
    <div class="flex items-center justify-between cursor-pointer select-none" onclick="toggleCart()">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 gold-gradient rounded-full flex items-center justify-center text-dark font-black relative">
          🛒<span id="cartBadgeCount" class="hidden absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
        </div>
        <div>
          <p class="text-[10px] font-bold text-primary opacity-80 uppercase tracking-widest">Cart Total</p>
          <p id="cartTotal" class="text-2xl font-black text-white leading-none">₹0</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[10px] font-black text-emerald-400 bg-emerald-500/10 border border-emerald-500/30 px-2 py-1 rounded-lg flex items-center gap-1">⏱️ <span id="cartTimer">15:00</span></span>
      </div>
    </div>
    
    <div id="cartExpandedContent" class="overflow-hidden transition-all duration-300" style="max-height: 0px; opacity: 0; margin-top: 0;">
      <div id="cartListUI" class="mb-3 max-h-40 overflow-y-auto text-white mt-4"></div>

      <!-- DYNAMIC UPSELL CAROUSEL -->
      <div class="mb-3 bg-white/5 border border-primary/25 rounded-2xl p-2.5">
        <p class="text-[10px] font-black text-primary uppercase tracking-wider mb-2">🍮 Complete Your Meal: Sweets & Drinks</p>
        <div id="cartUpsellCarousel" class="flex gap-2 overflow-x-auto hide-scroll pb-1"></div>
      </div>

      <button onclick="placeOrder()" class="w-full gold-gradient text-dark py-4 rounded-xl font-black text-sm uppercase tracking-widest">Send to Kitchen</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBKJxglt7aeg7uZ7jxNzX5aaIX0gJSIrQ", authDomain: "fusionmandi999-36066.firebaseapp.com", databaseURL: "https://fusionmandi999-36066-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "fusionmandi999-36066", storageBucket: "fusionmandi999-36066.firebasestorage.app", messagingSenderId: "312237706440", appId: "1:312237706440:web:f58610144c8e06a32ce9fd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let menuData = {}, cart = {}, currentFilter = 'All', customerPhone = '';
    let cartExpanded = false, sideDockOpen = false;

    // 15 Min Timer Logic
    let timeLeft = 15 * 60;
    setInterval(() => {
        if(timeLeft > 0) timeLeft--;
        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const s = (timeLeft % 60).toString().padStart(2, '0');
        const el = document.getElementById('cartTimer');
        if(el) el.innerText = `${m}:${s}`;
    }, 1000);

    window.registerCustomer = function() {
        const phone = document.getElementById('customerMobile').value;
        if(phone.length !== 10) return alert("Enter valid 10-digit mobile.");
        customerPhone = phone;
        document.getElementById('loginModal').style.display = 'none';
        document.body.classList.remove('overflow-hidden');
    };

    window.toggleSideDock = function() {
      sideDockOpen = !sideDockOpen;
      const dock = document.getElementById('sideServiceDock');
      const arrow = document.getElementById('sideDockArrow');
      if (sideDockOpen) {
        dock.classList.replace('dock-closed', 'dock-open');
        arrow.innerText = '▶';
      } else {
        dock.classList.replace('dock-open', 'dock-closed');
        arrow.innerText = '◀';
      }
    };

    window.requestStaff = function(type) {
        const tableVal = document.getElementById('tableNum').value;
        db.ref('service_requests').push({
            table: tableVal, phone: customerPhone || 'Guest', request_type: type, status: 'pending', timestamp: Date.now()
        }).then(() => {
            alert(`🛎️ ${type} request sent to staff!`);
            toggleSideDock();
        });
    };

    // Load Menu from Firebase
    db.ref('menu').on('value', snap => {
        menuData = snap.val() || {};
        renderMenu();
        renderUpsellCarousel();
    });

    window.filterMenu = function(cat, btnElem) {
      currentFilter = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
          btn.className = "category-btn px-6 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 hover:border-primary transition whitespace-nowrap";
      });
      if(btnElem) btnElem.className = "category-btn active px-6 py-2.5 rounded-xl font-bold text-sm bg-dark text-primary shadow-md transition whitespace-nowrap border border-primary/30";
      renderMenu();
    };

    function renderMenu() {
      const grid = document.getElementById('menuGrid'); grid.innerHTML = '';
      Object.entries(menuData).forEach(([id, item]) => {
        if(id === '_system_coupons' || !item.name) return;
        if (currentFilter !== 'All' && !(item.category||'').includes(currentFilter) && currentFilter !== 'Group') return;
        
        let selectHtml = `<div class="font-black text-xl text-primary mt-1">₹${item.base_price}</div>`;
        if (item.portions && Object.keys(item.portions).length > 0) {
          selectHtml = `<select id="var-${id}" class="w-full mt-2 p-2 rounded-lg text-xs font-bold bg-white border border-primary/20 outline-none text-dark">
            <option value="Regular|${item.base_price}">Regular (1P) - ₹${item.base_price}</option>
            ${Object.entries(item.portions).map(([pName, pPrice]) => `<option value="${pName}\vert{}${pPrice}">${pName} - ₹${pPrice}</option>`).join('')}
          </select>`;
        }

        grid.innerHTML += `
          <div class="food-card bg-card rounded-2xl p-4 flex flex-col relative overflow-hidden">
            <img src="${item.image_url}" class="w-full h-32 object-cover rounded-xl mb-3">
            <h3 class="font-black text-dark text-sm leading-tight">${item.name}</h3>
            ${selectHtml}
            <button onclick="addToCart('${id}')" class="mt-3 w-full bg-dark text-primary font-black text-xs py-2.5 rounded-xl active:scale-95 uppercase">+ Add</button>
          </div>`;
      });
    }

    function renderUpsellCarousel() {
        const carousel = document.getElementById('cartUpsellCarousel');
        if(!carousel) return;
        const upsellItems = Object.entries(menuData).filter(([k, v]) => (v.category||'').includes('Beverages') || (v.name||'').includes('Water') || (v.name||'').includes('Sweet'));
        
        carousel.innerHTML = upsellItems.map(([id, item]) => `
            <div class="min-w-[120px] bg-white/10 border border-white/20 p-2 rounded-xl text-center shrink-0 flex flex-col justify-between">
                <span class="text-xs font-bold text-white truncate w-full block">${item.name}</span>
                <span class="text-[10px] text-primary font-black block my-1">₹${item.base_price}</span>
                <button onclick="addToCart('${id}')" class="w-full bg-primary text-dark py-1.5 rounded-lg text-[10px] font-black uppercase shadow-sm">Add</button>
            </div>
        `).join('');
    }

    window.addToCart = function(id) {
        const item = menuData[id];
        let price = item.base_price, variant = "Regular";
        const sel = document.getElementById(`var-${id}`);
        if(sel) { const pts = sel.value.split('|'); variant = pts[0]; price = parseFloat(pts[1]); }
        
        const key = `${id}|${variant}`;
        if(cart[key]) cart[key].qty++;
        else cart[key] = { id, name: item.name, variant, price, qty: 1 };
        updateCartUI();
    };

    window.updateCartQty = function(key, change) {
        if(cart[key]) {
            cart[key].qty += change;
            if(cart[key].qty <= 0) delete cart[key];
            updateCartUI();
        }
    };

    window.toggleCart = function() {
      cartExpanded = !cartExpanded;
      const content = document.getElementById('cartExpandedContent');
      if(cartExpanded) {
        content.style.maxHeight = "600px"; content.style.opacity = "1"; content.style.marginTop = "1rem";
      } else {
        content.style.maxHeight = "0px"; content.style.opacity = "0"; content.style.marginTop = "0px";
      }
    };

    function updateCartUI() {
        const list = document.getElementById('cartListUI');
        let total = 0, totalQty = 0; list.innerHTML = '';
        Object.entries(cart).forEach(([key, i]) => {
            total += i.price * i.qty; totalQty += i.qty;
            list.innerHTML += `
            <div class="flex items-center justify-between py-2 border-b border-white/10">
                <div>
                    <span class="font-bold text-sm text-white">${i.name}</span>
                    <span class="text-[10px] text-primary block">${i.variant}</span>
                </div>
                <div class="flex items-center bg-white/10 rounded-lg p-1">
                    <button onclick="updateCartQty('${key}', -1)" class="w-7 h-7 text-white font-black">-</button>
                    <span class="w-6 text-center text-xs font-black">${i.qty}</span>
                    <button onclick="updateCartQty('${key}', 1)" class="w-7 h-7 text-primary font-black">+</button>
                </div>
            </div>`;
        });
        
        document.getElementById('cartTotal').innerText = `₹${total}`;
        document.getElementById('cartBadgeCount').innerText = totalQty;
        document.getElementById('cartBadgeCount').classList.toggle('hidden', totalQty === 0);
        document.getElementById('cartFooter').classList.toggle('hidden', totalQty === 0);
        if(totalQty > 0 && !cartExpanded) {
            document.getElementById('cartFooter').classList.add('cart-pop-in');
        }
    }

    // Smart Coupon Logic
    window.quickApplyMCCoupon = function() {
        let total = 0;
        Object.values(cart).forEach(i => total += (i.price * i.qty));
        
        if (total === 0) return alert("Cart is empty.");
        
        let discount = 0;
        if (total >= 899) discount = 100;
        else if (total >= 100) discount = 50;
        else return alert("Minimum ₹100 order required for 'MC' coupon.");
        
        const percent = Math.round((discount / total) * 100);
        alert(`🎉 MC Coupon Applied! You saved ₹${discount} (Approx ${percent}% OFF)`);
    };

    window.placeOrder = function() {
        if(Object.keys(cart).length === 0) return;
        const tNum = document.getElementById('tableNum').value;
        const tableId = `table_${tNum}`;
        const batchId = `${Date.now()}`;
        
        let subtotal = 0;
        const lineItems = {};
        Object.values(cart).forEach((item, idx) => {
            subtotal += item.price * item.qty;
            lineItems[`${batchId}_${idx}`] = { ...item, addedAt: Date.now() + idx, cancelled: false };
        });

        // Auto Apply MC Coupon if valid on checkout
        let discountAmount = 0;
        if (subtotal >= 899) discountAmount = 100;
        else if (subtotal >= 100) discountAmount = 50;

        const total = subtotal - discountAmount;
        const itemsStr = Object.values(lineItems).map(i => `${i.qty}x ${i.name}`).join(' | ');

        db.ref(`active_tables/${tableId}`).set({
            table: tNum, phone: customerPhone, status: 'pending', timestamp: Date.now(),
            line_items: lineItems, items: itemsStr, subtotal, discountAmount, couponCode: discountAmount > 0 ? 'MC' : '', total
        }).then(() => {
            alert('Order Sent to Kitchen!');
            cart = {}; updateCartUI(); toggleCart();
        });
    };
  </script>
</body>
</html>
